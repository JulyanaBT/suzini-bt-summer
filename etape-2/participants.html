<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Équipes — Étape 2 BT250</title>

  <link rel="stylesheet" href="../assets/css/style.css" />

  <style>
    main{padding-top:0;padding-bottom:24px;}
    .section{margin-top:10px;}
    .section:first-child{margin-top:0;}
    .compact-panel{padding:12px;border-radius:22px;}

    .top-box{
      border-radius:0 0 22px 22px;
      padding:12px;
      background:#ff3e8a;
      color:#fff;
      box-shadow:0 10px 22px rgba(16,24,40,.12);
    }

    .top-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .top-title{
      margin:0;
      font-size:24px;
      line-height:1;
      font-weight:1000;
      letter-spacing:-.04em;
    }

    .top-pill{
      flex-shrink:0;
      padding:7px 11px;
      border-radius:999px;
      background:#fff;
      color:#063b72;
      font-size:12px;
      font-weight:1000;
    }

    .summary-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }

    .summary-box{
      background:#fff;
      color:#063b72;
      border-radius:16px;
      padding:10px;
      text-align:center;
      font-weight:1000;
      box-shadow:0 6px 14px rgba(16,24,40,.08);
    }

    .summary-box strong{
      display:block;
      font-size:24px;
      line-height:1;
    }

    .summary-box span{
      display:block;
      margin-top:4px;
      font-size:10px;
      color:#667085;
      text-transform:uppercase;
      letter-spacing:.04em;
    }

    .teams-list{
      display:grid;
      gap:8px;
    }

    .team-card{
      background:#fff;
      color:#102033;
      border-radius:18px;
      padding:11px;
      display:grid;
      grid-template-columns:1fr 58px;
      gap:10px;
      align-items:center;
      box-shadow:0 8px 18px rgba(16,24,40,.10);
      border:1px solid rgba(16,24,40,.08);
    }

    .team-left{
      min-width:0;
      display:grid;
      gap:6px;
    }

    .team-name{
      font-size:18px;
      font-weight:1000;
      color:#063b72;
      line-height:1.05;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .team-num{
      color:#667085;
      font-size:11px;
      font-weight:1000;
    }

    .player-line{
      min-height:28px;
      border-radius:13px;
      padding:6px 8px;
      background:#f8fafc;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      font-size:13px;
      font-weight:950;
      line-height:1.1;
      min-width:0;
    }

    .player-name{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .rank-pill{
      flex-shrink:0;
      padding:4px 8px;
      border-radius:999px;
      background:#fff7d6;
      color:#102033;
      font-size:11px;
      font-weight:1000;
    }

    .rank-team{
      min-width:58px;
      min-height:58px;
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      background:linear-gradient(180deg,#ffd84d,#f3b800);
      color:#102033;
      font-size:20px;
      font-weight:1000;
      box-shadow:0 8px 16px rgba(255,216,77,.22);
    }

    .empty{
      padding:12px;
      border-radius:16px;
      background:#fff;
      color:#667085;
      font-size:14px;
      font-weight:900;
      text-align:center;
    }

    .note{
      margin-top:10px;
      color:#667085;
      font-size:12px;
      font-weight:850;
      line-height:1.3;
    }

    @media(min-width:760px){
      .teams-list{grid-template-columns:1fr 1fr;}
      .top-box{padding:16px;}
    }
  </style>
</head>

<body
  data-page="participants"
  data-type="double-mixte"
  data-title="Étape 2 - Double Mixte"
  data-date="09 juillet 2026"
>

<div id="siteHeaderEtape"></div>

<main class="container">

  <section class="section">
    <div class="top-box">
      <div class="top-row">
        <h1 class="top-title">👥 Équipes</h1>
        <div class="top-pill">12 max</div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="summer-panel compact-panel">
      <div class="summary-grid">
        <div class="summary-box">
          <strong id="countTotal">0</strong>
          <span>Équipes</span>
        </div>

        <div class="summary-box">
          <strong id="countRegistered">0</strong>
          <span>Inscrites</span>
        </div>

        <div class="summary-box">
          <strong id="countConfirmed">0</strong>
          <span>Confirmées</span>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="summer-panel compact-panel">
      <div id="teamsList" class="teams-list">
        <div class="empty">Chargement des équipes…</div>
      </div>

      <p class="note">
        Les classements affichés sont indicatifs et pourront être ajustés par l’organisation.
      </p>
    </div>
  </section>

</main>

<script type="module" src="../assets/js/header-etape.js"></script>
<script type="module" src="../assets/js/maintenance-guard-etape.js"></script>

<script type="module">
  import { db } from "../assets/js/firebase.js?v=etape2-equipes-public-2";

  import {
    collection,
    onSnapshot,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const EVENT_ID = "suzini-summer-tour-2026";
  const STEP_ID = "etape-2";

  const teamsList = document.getElementById("teamsList");
  const countTotal = document.getElementById("countTotal");
  const countRegistered = document.getElementById("countRegistered");
  const countConfirmed = document.getElementById("countConfirmed");

  const teamsRef = collection(db, "events", EVENT_ID, "steps", STEP_ID, "teams");

  function esc(value){
    return String(value || "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function toNum(value){
    if(value === null || value === undefined || value === "") return null;
    const n = Number(String(value).replace(",", ".").trim());
    return Number.isFinite(n) ? n : null;
  }

  function fmtRank(value){
    const n = toNum(value);
    return n === null ? "—" : String(n);
  }

  function playerShort(player){
    const prenom = String(player?.prenom || "").trim() || "Joueur";
    const nom = String(player?.nom || "").trim();
    const initial = nom ? ` ${nom.charAt(0).toUpperCase()}.` : "";
    return `${prenom}${initial}`;
  }

  function playerRank(player, fallback){
    return player?.rank ?? fallback ?? null;
  }

  function teamRank(team){
    const woman = team.woman || team.player1 || {};
    const man = team.man || team.player2 || {};

    const wRank = toNum(playerRank(woman, team.p1Rank));
    const mRank = toNum(playerRank(man, team.p2Rank));

    if(wRank === null || mRank === null) return null;
    return wRank + mRank;
  }

  function statusOk(team){
    return team.status !== "deleted"
      && team.status !== "cancelled"
      && team.status !== "refused"
      && team.stby !== true
      && team.list !== "wait";
  }

  function teamCard(team, index){
    const woman = team.woman || team.player1 || {};
    const man = team.man || team.player2 || {};
    const teamName = team.teamName || `${woman.prenom || "Joueuse"} & ${man.prenom || "Joueur"}`;

    const wRank = playerRank(woman, team.p1Rank);
    const mRank = playerRank(man, team.p2Rank);
    const rank = teamRank(team);

    return `
      <div class="team-card">
        <div class="team-left">
          <div>
            <div class="team-num">#${index + 1}</div>
            <div class="team-name">${esc(teamName)}</div>
          </div>

          <div class="player-line">
            <span class="player-name">👩 ${esc(playerShort(woman))}</span>
            <span class="rank-pill">${esc(fmtRank(wRank))}</span>
          </div>

          <div class="player-line">
            <span class="player-name">👨 ${esc(playerShort(man))}</span>
            <span class="rank-pill">${esc(fmtRank(mRank))}</span>
          </div>
        </div>

        <div class="rank-team">
          ${esc(fmtRank(rank))}
        </div>
      </div>
    `;
  }

  onSnapshot(query(teamsRef, orderBy("createdAt", "asc")), (snap) => {
    const teams = snap.docs
      .map(d => ({ id:d.id, ...d.data() }))
      .filter(statusOk)
      .sort((a,b) => {
        const ar = teamRank(a);
        const br = teamRank(b);

        const av = ar === null ? Number.POSITIVE_INFINITY : ar;
        const bv = br === null ? Number.POSITIVE_INFINITY : br;

        if(av !== bv) return av - bv;

        const at = a.createdAt?.seconds || 0;
        const bt = b.createdAt?.seconds || 0;
        return at - bt;
      });

    let registered = 0;
    let confirmed = 0;

    teams.forEach(team => {
      if(team.status === "confirmed") confirmed++;
      else registered++;
    });

    countTotal.textContent = String(teams.length);
    countRegistered.textContent = String(registered);
    countConfirmed.textContent = String(confirmed);

    teamsList.innerHTML = teams.length
      ? teams.map(teamCard).join("")
      : `<div class="empty">Aucune équipe inscrite pour le moment.</div>`;

  }, (error) => {
    console.error(error);
    teamsList.innerHTML = `<div class="empty">Impossible de charger les équipes.</div>`;
  });
</script>

</body>
</html>
