<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Programmation — Étape 2 BT250</title>

  <link rel="stylesheet" href="../assets/css/style.css" />

  <style>
    main{padding-top:0;padding-bottom:24px;}
    .section{margin-top:10px;}
    .section:first-child{margin-top:0;}
    .compact-panel{padding:12px;border-radius:22px;}

    .placeholder-card{
      border-radius:0 0 22px 22px;
      padding:16px 14px;
      background:linear-gradient(135deg,#ff3e8a,#063b72);
      color:#fff;
      box-shadow:0 10px 22px rgba(16,24,40,.12);
      text-align:center;
    }

    .placeholder-title{
      margin:0;
      font-size:26px;
      line-height:1;
      font-weight:1000;
      letter-spacing:-.04em;
    }

    .placeholder-text{
      margin:8px 0 0;
      font-size:14px;
      line-height:1.35;
      font-weight:900;
    }

    .status-box{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }

    .status-item{
      background:#fff;
      border-radius:16px;
      padding:10px 6px;
      text-align:center;
      box-shadow:0 6px 14px rgba(16,24,40,.08);
    }

    .status-item strong{
      display:block;
      font-size:22px;
      line-height:1;
      color:#063b72;
      font-weight:1000;
    }

    .status-item span{
      display:block;
      margin-top:4px;
      font-size:10px;
      color:#667085;
      font-weight:1000;
      text-transform:uppercase;
    }

    .info-card{
      display:grid;
      gap:8px;
      border-radius:18px;
      padding:12px;
      background:#fff;
      color:#102033;
      box-shadow:0 8px 18px rgba(16,24,40,.10);
    }

    .info-title{
      font-size:20px;
      font-weight:1000;
      color:#063b72;
      line-height:1;
    }

    .info-text{
      color:#667085;
      font-size:14px;
      font-weight:900;
      line-height:1.35;
    }

    .action-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:10px;
    }

    .action-btn{
      min-height:44px;
      border-radius:16px;
      padding:10px 12px;
      background:#063b72;
      color:#fff;
      font-size:14px;
      font-weight:1000;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      text-decoration:none;
    }

    .action-btn.primary{
      background:linear-gradient(180deg,#ffd84d,#f3b800);
      color:#102033;
    }
  </style>
</head>

<body
  data-page="programmation"
  data-type="double-mixte"
  data-title="Étape 2 - Double Mixte"
  data-date="09 juillet 2026"
>

<div id="siteHeaderEtape"></div>

<main class="container">

  <section class="section">
    <div class="placeholder-card">
      <h1 class="placeholder-title">📋 Programmation</h1>
      <p class="placeholder-text">
        La programmation sera publiée après la clôture des inscriptions et le tirage.
      </p>
    </div>
  </section>

  <section class="section">
    <div class="summer-panel compact-panel">
      <div class="status-box">
        <div class="status-item">
          <strong id="countTeams">0</strong>
          <span>Équipes</span>
        </div>

        <div class="status-item">
          <strong>12</strong>
          <span>Max</span>
        </div>

        <div class="status-item">
          <strong id="statusIcon">⏳</strong>
          <span>À venir</span>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="summer-panel compact-panel">
      <div class="info-card">
        <div class="info-title">🟢 Inscriptions en cours</div>
        <div class="info-text">
          Les horaires, poules et terrains seront visibles ici dès publication officielle.
        </div>

        <div class="action-grid">
          <a class="action-btn primary" href="inscriptions.html">📝 S’inscrire</a>
          <a class="action-btn" href="participants.html">👥 Voir les équipes</a>
          <a class="action-btn" href="tirage.html">🎲 Tirage</a>
          <a class="action-btn" href="classement.html">🏆 Classement</a>
        </div>
      </div>
    </div>
  </section>

</main>

<script type="module" src="../assets/js/header-etape.js"></script>
<script type="module" src="../assets/js/maintenance-guard-etape.js"></script>

<script type="module">
  import { db } from "../assets/js/firebase.js?v=etape2-prog-placeholder-1";

  import {
    collection,
    doc,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const EVENT_ID = "suzini-summer-tour-2026";
  const STEP_ID = "etape-2";

  const countTeams = document.getElementById("countTeams");
  const statusIcon = document.getElementById("statusIcon");

  const teamsRef = collection(db, "events", EVENT_ID, "steps", STEP_ID, "teams");
  const programmationRef = doc(db, "events", EVENT_ID, "steps", STEP_ID, "config", "programmation");

  onSnapshot(teamsRef, (snap) => {
    countTeams.textContent = String(snap.size);
  });

  onSnapshot(programmationRef, (snap) => {
    const data = snap.exists() ? snap.data() : {};

    if(data.publicVisible === true){
      statusIcon.textContent = "✅";
    }else{
      statusIcon.textContent = "⏳";
    }
  });
</script>

</body>
</html>
