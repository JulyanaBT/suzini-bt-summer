<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Participants</title>

  <link rel="stylesheet" href="../assets/css/style.css" />

  <style>
    main{padding-top:0;padding-bottom:24px;}
    .section{margin-top:10px;}
    .section:first-child{margin-top:0;}
    .compact-panel{padding:12px;border-radius:22px;}

    .admin-status{
      padding:10px 12px;
      border-radius:16px;
      background:#fff;
      color:#102033;
      font-size:13px;
      font-weight:900;
      line-height:1.35;
      box-shadow:0 6px 14px rgba(16,24,40,.08);
    }

    .summary-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
    }

    .summary-box{
      background:#fff;
      color:#063b72;
      border-radius:16px;
      padding:10px 6px;
      text-align:center;
      font-weight:1000;
    }

    .summary-box strong{
      display:block;
      font-size:22px;
      line-height:1;
    }

    .summary-box span{
      display:block;
      margin-top:4px;
      font-size:9px;
      color:#667085;
      text-transform:uppercase;
    }

    .actions-row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:10px;
    }

    .btn{
      min-height:40px;
      border:0;
      border-radius:14px;
      padding:9px 11px;
      font-size:13px;
      font-weight:1000;
      cursor:pointer;
      background:#063b72;
      color:#fff;
      font-family:inherit;
    }

    .btn.green{background:#0b7a3b;}
    .btn.pink{background:#ff3e8a;}
    .btn.yellow{background:#ffd84d;color:#102033;}
    .btn.red{background:#9b1c1c;}

    .cards-list{
      display:grid;
      gap:10px;
    }

    .item-card{
      background:#fff;
      color:#102033;
      border-radius:18px;
      padding:12px;
      display:grid;
      gap:8px;
      box-shadow:0 8px 18px rgba(16,24,40,.10);
      border:1px solid rgba(16,24,40,.08);
    }

    .item-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
    }

    .item-title{
      font-size:19px;
      font-weight:1000;
      color:#063b72;
      line-height:1.05;
    }

    .item-sub{
      margin-top:4px;
      font-size:12px;
      color:#667085;
      font-weight:900;
      line-height:1.25;
    }

    .pill{
      flex-shrink:0;
      padding:6px 10px;
      border-radius:999px;
      font-size:10px;
      font-weight:1000;
      text-transform:uppercase;
      background:#fff7d6;
      color:#102033;
      white-space:nowrap;
    }

    .pill.confirmed{background:#d9fbe8;color:#087a35;}
    .pill.stby{background:#ffeef2;color:#9b1733;}
    .pill.wait{background:#f1f5f9;color:#475467;}

    .player-line{
      min-height:34px;
      border-radius:14px;
      padding:8px 10px;
      background:#f8fafc;
      font-size:13px;
      font-weight:900;
      line-height:1.2;
    }

    .player-line strong{color:#063b72;}

    details{
      border-top:1px solid rgba(16,24,40,.08);
      padding-top:8px;
    }

    details summary{
      cursor:pointer;
      list-style:none;
      font-weight:1000;
      color:#063b72;
    }

    details summary::-webkit-details-marker{display:none;}

    .mini-actions{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:8px;
    }

    .mini-btn{
      border:0;
      border-radius:999px;
      padding:8px 12px;
      font-size:12px;
      font-weight:1000;
      background:#ff3e8a;
      color:#fff;
      cursor:pointer;
      font-family:inherit;
    }

    .mini-btn.green{background:#0b7a3b;}
    .mini-btn.yellow{background:#ffd84d;color:#102033;}
    .mini-btn.blue{background:#063b72;}
    .mini-btn.red{background:#9b1c1c;}

    @media(min-width:760px){
      .cards-list{grid-template-columns:1fr 1fr;}
      .actions-row{grid-template-columns:repeat(3,1fr);}
    }
  </style>
</head>

<body data-page="participants" data-step="etape-1">

<div id="adminHeader"></div>

<main class="container">

  <section class="section" id="accessDenied" style="display:none;">
    <div class="summer-panel compact-panel">
      <h1 class="summer-panel-title">⛔ Accès refusé</h1>
      <p class="summer-panel-text">Cette page est réservée aux administrateurs.</p>
    </div>
  </section>

  <section class="section" id="pageContent" style="display:none;">
    <div class="summer-panel compact-panel">
      <div class="summer-panel-head">
        <div>
          <h1 class="summer-panel-title" id="pageTitle">Participants</h1>
          <p class="summer-panel-text" id="pageText">Gestion des inscrits.</p>
        </div>
        <div class="summer-pill" id="stepLabel">Étape</div>
      </div>

      <div class="summary-grid">
        <div class="summary-box"><strong id="countTotal">0</strong><span>Total</span></div>
        <div class="summary-box"><strong id="countMain">0</strong><span>Liste</span></div>
        <div class="summary-box"><strong id="countWait">0</strong><span>Attente</span></div>
        <div class="summary-box"><strong id="countConfirmed">0</strong><span>Confirmés</span></div>
      </div>

      <div class="actions-row">
        <button class="btn" id="btnRefresh" type="button">🔄 Rafraîchir</button>
        <button class="btn yellow" id="btnExpand" type="button">🧩 Développer</button>
        <button class="btn pink" id="btnCollapse" type="button">🧊 Réduire</button>
      </div>

      <div class="admin-status" id="statusMsg" style="margin-top:10px;">Chargement…</div>
    </div>
  </section>

  <section class="section" id="listSection" style="display:none;">
    <div class="summer-panel compact-panel">
      <div id="cardsList" class="cards-list">
        <div class="admin-status">Chargement…</div>
      </div>
    </div>
  </section>

</main>

<script type="module" src="../assets/js/header-admin.js"></script>

<script type="module">
  import { auth, db } from "../assets/js/firebase.js?v=admin-participants-summer-3";
  import { getRoleByUid } from "../assets/js/session.js?v=admin-participants-summer-3";

  import {
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

  import {
    collection,
    doc,
    onSnapshot,
    updateDoc,
    deleteDoc,
    query,
    orderBy,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const EVENT_ID = "suzini-summer-tour-2026";

  const params = new URLSearchParams(window.location.search);
  const STEP_ID = params.get("step") || "etape-1";
  document.body.dataset.step = STEP_ID;

  const isAmericano = STEP_ID === "etape-1";
  const collectionName = isAmericano ? "players" : "teams";

  const stepNames = {
    "etape-1":"Étape 1 — Americano",
    "etape-2":"Étape 2 — Double mixte",
    "etape-3":"Étape 3 — Double mixte"
  };

  const accessDenied = document.getElementById("accessDenied");
  const pageContent = document.getElementById("pageContent");
  const listSection = document.getElementById("listSection");

  const pageTitle = document.getElementById("pageTitle");
  const pageText = document.getElementById("pageText");
  const stepLabel = document.getElementById("stepLabel");
  const statusMsg = document.getElementById("statusMsg");

  const countTotal = document.getElementById("countTotal");
  const countMain = document.getElementById("countMain");
  const countWait = document.getElementById("countWait");
  const countConfirmed = document.getElementById("countConfirmed");

  const cardsList = document.getElementById("cardsList");

  const btnRefresh = document.getElementById("btnRefresh");
  const btnExpand = document.getElementById("btnExpand");
  const btnCollapse = document.getElementById("btnCollapse");

  const itemsRef = collection(db, "events", EVENT_ID, "steps", STEP_ID, collectionName);

  let unsubscribeItems = null;
  let rows = [];

  stepLabel.textContent = stepNames[STEP_ID] || STEP_ID;
  pageTitle.textContent = isAmericano ? "Joueurs" : "Équipes";
  pageText.textContent = isAmericano
    ? "Gestion des joueurs de l’Americano."
    : "Gestion des équipes de double mixte.";

  function esc(value){
    return String(value || "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function fmt(value){
    const v = String(value || "").trim();
    return v || "—";
  }

  function toNum(value){
    if(value === null || value === undefined || value === "") return null;
    const n = Number(String(value).replace(",", ".").trim());
    return Number.isFinite(n) ? n : null;
  }

  function itemRef(id){
    return doc(db, "events", EVENT_ID, "steps", STEP_ID, collectionName, id);
  }

  function isWait(row){
    return row.list === "wait" || row.publicList === "waiting" || row.status === "waiting";
  }

  function isStby(row){
    return row.stby === true || row.status === "stby";
  }

  function isConfirmed(row){
    return row.status === "confirmed";
  }

  function statusPill(row){
    if(isStby(row)) return `<span class="pill stby">STBY</span>`;
    if(isWait(row)) return `<span class="pill wait">Attente</span>`;
    if(isConfirmed(row)) return `<span class="pill confirmed">Confirmé</span>`;
    return `<span class="pill">Inscrit</span>`;
  }

  function fullName(player){
    return `${player?.prenom || ""} ${player?.nom || ""}`.trim() || "—";
  }

  function rankingValue(row){
    const woman = row.woman || row.player1 || {};
    const man = row.man || row.player2 || {};
    const a = toNum(woman.rank ?? row.p1Rank);
    const b = toNum(man.rank ?? row.p2Rank);
    if(a === null || b === null) return null;
    return a + b;
  }

  function playerCard(row, index){
    const nickname = row.surnom || row.nickname || "Sans surnom";

    return `
      <div class="item-card" data-id="${esc(row.id)}">
        <div class="item-head">
          <div>
            <div class="item-title">#${index + 1} — ${esc(nickname)}</div>
            <div class="item-sub">${esc(fullName(row))}</div>
          </div>
          ${statusPill(row)}
        </div>

        <div class="player-line">
          <strong>Nom :</strong> ${esc(row.prenom || "")} ${esc(row.nom || "")}<br>
          <strong>Statut :</strong> ${esc(row.status || "registered")}
        </div>

        <details>
          <summary>⚙️ Actions</summary>
          <div class="mini-actions">
            <button class="mini-btn green" data-action="confirm" data-id="${esc(row.id)}">Confirmer</button>
            <button class="mini-btn yellow" data-action="main" data-id="${esc(row.id)}">Actif / liste</button>
            <button class="mini-btn blue" data-action="wait" data-id="${esc(row.id)}">Attente</button>
            <button class="mini-btn red" data-action="delete" data-id="${esc(row.id)}" data-key="${esc(row.nicknameKey || "")}">Supprimer</button>
          </div>
        </details>
      </div>
    `;
  }

  function teamCard(row, index){
    const woman = row.woman || row.player1 || {};
    const man = row.man || row.player2 || {};
    const teamName = row.teamName || `${woman.prenom || "Joueuse"} & ${man.prenom || "Joueur"}`;
    const rank = rankingValue(row);

    return `
      <div class="item-card" data-id="${esc(row.id)}">
        <div class="item-head">
          <div>
            <div class="item-title">#${index + 1} — ${esc(teamName)}</div>
            <div class="item-sub">
              ID : ${esc(row.id)}
              ${rank === null ? "" : ` • Rang équipe : ${esc(rank)}`}
            </div>
          </div>
          ${statusPill(row)}
        </div>

        <div class="player-line">
          👩 <strong>Joueuse :</strong> ${esc(fullName(woman))}<br>
          Licence : ${esc(fmt(woman.licence))} • Classement BT : ${esc(fmt(woman.rank ?? row.p1Rank))}
        </div>

        <div class="player-line">
          👨 <strong>Joueur :</strong> ${esc(fullName(man))}<br>
          Licence : ${esc(fmt(man.licence))} • Classement BT : ${esc(fmt(man.rank ?? row.p2Rank))}
        </div>

        <details>
          <summary>⚙️ Actions / Modifier</summary>

          <div class="mini-actions">
            <button class="mini-btn green" data-action="confirm" data-id="${esc(row.id)}">Confirmer</button>
            <button class="mini-btn yellow" data-action="main" data-id="${esc(row.id)}">Liste principale</button>
            <button class="mini-btn blue" data-action="wait" data-id="${esc(row.id)}">Liste attente</button>
            <button class="mini-btn" data-action="stby" data-id="${esc(row.id)}">${isStby(row) ? "Réactiver" : "STBY"}</button>
          </div>

          <div class="mini-actions">
            <button class="mini-btn blue" data-action="edit" data-id="${esc(row.id)}">Modifier équipe</button>
            <button class="mini-btn yellow" data-action="rank" data-id="${esc(row.id)}">Classements BT</button>
            <button class="mini-btn red" data-action="delete" data-id="${esc(row.id)}">Supprimer</button>
          </div>
        </details>
      </div>
    `;
  }

  function render(){
    let main = 0;
    let wait = 0;
    let confirmed = 0;

    rows.forEach(row => {
      if(isWait(row)) wait++;
      else main++;

      if(isConfirmed(row)) confirmed++;
    });

    countTotal.textContent = String(rows.length);
    countMain.textContent = String(main);
    countWait.textContent = String(wait);
    countConfirmed.textContent = String(confirmed);

    cardsList.innerHTML = rows.length
      ? rows.map((row, index) => isAmericano ? playerCard(row, index) : teamCard(row, index)).join("")
      : `<div class="admin-status">Aucune inscription pour le moment.</div>`;

    statusMsg.textContent = `✅ ${rows.length} élément(s) chargé(s).`;
  }

  function startListener(){
    if(unsubscribeItems) unsubscribeItems();

    unsubscribeItems = onSnapshot(
      query(itemsRef, orderBy("createdAt", "asc")),
      (snap) => {
        rows = snap.docs.map(d => ({ id:d.id, ...d.data() }));
        render();
      },
      (error) => {
        console.error(error);
        statusMsg.textContent = "❌ Impossible de charger.";
      }
    );
  }

  function stopListener(){
    if(unsubscribeItems){
      unsubscribeItems();
      unsubscribeItems = null;
    }
  }

  async function patchItem(id, patch){
    await updateDoc(itemRef(id), {
      ...patch,
      updatedAt:serverTimestamp(),
      updatedBy:auth.currentUser?.uid || null
    });
  }

  async function editTeam(row){
    const woman = row.woman || row.player1 || {};
    const man = row.man || row.player2 || {};

    const wPrenom = prompt("Joueuse — Prénom :", woman.prenom || "");
    if(wPrenom === null) return;

    const wNom = prompt("Joueuse — Nom :", woman.nom || "");
    if(wNom === null) return;

    const wLicence = prompt("Joueuse — Licence :", woman.licence || "");
    if(wLicence === null) return;

    const mPrenom = prompt("Joueur — Prénom :", man.prenom || "");
    if(mPrenom === null) return;

    const mNom = prompt("Joueur — Nom :", man.nom || "");
    if(mNom === null) return;

    const mLicence = prompt("Joueur — Licence :", man.licence || "");
    if(mLicence === null) return;

    const newWoman = {
      ...woman,
      prenom:wPrenom.trim(),
      nom:wNom.trim(),
      licence:wLicence.trim(),
      sexe:"F"
    };

    const newMan = {
      ...man,
      prenom:mPrenom.trim(),
      nom:mNom.trim(),
      licence:mLicence.trim(),
      sexe:"M"
    };

    await patchItem(row.id, {
      teamName:`${newWoman.prenom} & ${newMan.prenom}`,
      woman:newWoman,
      man:newMan,
      player1:newWoman,
      player2:newMan
    });
  }

  async function editRanks(row){
    const woman = row.woman || row.player1 || {};
    const man = row.man || row.player2 || {};

    const wr = prompt("Classement BT joueuse :", woman.rank ?? row.p1Rank ?? "");
    if(wr === null) return;

    const mr = prompt("Classement BT joueur :", man.rank ?? row.p2Rank ?? "");
    if(mr === null) return;

    const wRank = wr.trim() === "" ? null : toNum(wr);
    const mRank = mr.trim() === "" ? null : toNum(mr);

    if(wr.trim() !== "" && wRank === null) return alert("Classement joueuse invalide.");
    if(mr.trim() !== "" && mRank === null) return alert("Classement joueur invalide.");

    const newWoman = { ...woman, rank:wRank };
    const newMan = { ...man, rank:mRank };

    await patchItem(row.id, {
      woman:newWoman,
      man:newMan,
      player1:newWoman,
      player2:newMan,
      p1Rank:wRank,
      p2Rank:mRank
    });
  }

  cardsList.addEventListener("click", async (event) => {
    const btn = event.target.closest("button[data-action]");
    if(!btn) return;

    const id = btn.dataset.id;
    const action = btn.dataset.action;
    const row = rows.find(r => r.id === id);
    if(!row) return;

    try{
      if(action === "confirm"){
        await patchItem(id, { status:"confirmed" });
      }

      if(action === "main"){
        await patchItem(id, isAmericano
          ? { publicList:"active", status:"active" }
          : { list:"main", stby:false, status:row.status === "confirmed" ? "confirmed" : "registered" }
        );
      }

      if(action === "wait"){
        await patchItem(id, isAmericano
          ? { publicList:"waiting", status:"waiting" }
          : { list:"wait", stby:false }
        );
      }

      if(action === "stby"){
        await patchItem(id, { stby:!isStby(row) });
      }

      if(action === "edit"){
        await editTeam(row);
      }

      if(action === "rank"){
        await editRanks(row);
      }

      if(action === "delete"){
        const ok = confirm("Supprimer cette inscription ?");
        if(!ok) return;

        await deleteDoc(itemRef(id));

        if(isAmericano && btn.dataset.key){
          await deleteDoc(doc(db, "summerTourNicknames", btn.dataset.key));
        }
      }

    }catch(error){
      console.error(error);
      alert("Action impossible.");
    }
  });

  btnRefresh.onclick = render;
  btnExpand.onclick = () => document.querySelectorAll("details").forEach(d => d.open = true);
  btnCollapse.onclick = () => document.querySelectorAll("details").forEach(d => d.open = false);

  onAuthStateChanged(auth, async (user) => {
    stopListener();

    accessDenied.style.display = "none";
    pageContent.style.display = "none";
    listSection.style.display = "none";

    if(!user){
      accessDenied.style.display = "block";
      return;
    }

    try{
      const role = await getRoleByUid(user.uid);

      if(role !== "admin"){
        accessDenied.style.display = "block";
        return;
      }

      pageContent.style.display = "block";
      listSection.style.display = "block";
      startListener();

    }catch(error){
      console.error(error);
      accessDenied.style.display = "block";
    }
  });
</script>

</body>
</html>
