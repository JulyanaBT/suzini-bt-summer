<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Programmation</title>

  <link rel="stylesheet" href="../assets/css/style.css" />

  <style>
    main{padding-top:8px;padding-bottom:24px;}
    .section{margin-top:8px;}
    .compact-panel{padding:12px;}

    .admin-status{
      padding:10px 12px;
      border-radius:16px;
      background:#fff;
      color:#102033;
      font-size:13px;
      font-weight:1000;
      line-height:1.3;
      box-shadow:0 6px 14px rgba(16,24,40,.08);
    }

    .actions-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:8px;
      margin-top:10px;
    }

    .admin-btn{
      min-height:40px;
      border:0;
      border-radius:14px;
      padding:9px 11px;
      font-size:13px;
      font-weight:1000;
      cursor:pointer;
      background:#063b72;
      color:#fff;
    }

    .admin-btn.green{background:#0b7a3b;}
    .admin-btn.yellow{background:#ffd84d;color:#102033;}
    .admin-btn.red{background:#9b1c1c;}
    .admin-btn.blue{background:#063b72;}
    .admin-btn:disabled{opacity:.55;cursor:not-allowed;}

    .section-title{
      margin:0 0 8px;
      font-size:19px;
      color:#063b72;
      font-weight:1000;
      letter-spacing:-.03em;
    }

    .rounds-list{display:grid;gap:8px;}

    .round-card{
      background:#fff;
      color:#102033;
      border-radius:18px;
      padding:10px;
      display:grid;
      gap:7px;
      box-shadow:0 8px 18px rgba(16,24,40,.10);
      border:1px solid rgba(16,24,40,.08);
    }

    .round-title{
      font-size:17px;
      font-weight:1000;
      color:#063b72;
      line-height:1;
    }

    .court-block{
      border-radius:15px;
      padding:8px;
      display:grid;
      gap:5px;
      border:1px solid rgba(16,24,40,.08);
    }

    .court-lisa{background:#ffeef2;border-color:rgba(255,0,60,.20);}
    .court-manon{background:#fff8dd;border-color:rgba(255,196,0,.35);}

    .court-head{
      display:grid;
      grid-template-columns:1fr auto auto;
      gap:6px;
      align-items:center;
    }

    .court-name{
      font-size:12px;
      font-weight:1000;
      color:#063b72;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .edit-btn{
      width:26px;
      height:26px;
      border:0;
      border-radius:999px;
      background:#fff;
      color:#063b72;
      font-size:14px;
      font-weight:1000;
      cursor:pointer;
      box-shadow:0 4px 10px rgba(16,24,40,.12);
    }

    .match-pill{
      padding:4px 8px;
      border-radius:999px;
      font-size:9px;
      font-weight:1000;
      text-transform:uppercase;
      background:#fff7d6;
      color:#102033;
      white-space:nowrap;
    }

    .match-pill.current{background:#d9fbe8;color:#087a35;}
    .match-pill.done{background:#e6f7ee;color:#087a35;}

    .team-row{
      display:grid;
      grid-template-columns:1fr 46px;
      gap:6px;
      align-items:center;
    }

    .team-name{
      min-height:30px;
      border-radius:12px;
      padding:7px 9px;
      background:rgba(255,255,255,.82);
      font-size:13px;
      font-weight:1000;
      color:#102033;
      line-height:1.05;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .score-input{
      width:100%;
      min-height:30px;
      border:1px solid rgba(16,24,40,.14);
      border-radius:12px;
      padding:5px 6px;
      font-size:15px;
      font-weight:1000;
      text-align:center;
      color:#063b72;
      background:#fff;
    }

    .score-input:disabled{background:#f8fafc;color:#667085;}

    .empty{
      padding:12px 14px;
      border-radius:16px;
      background:#fff;
      color:#667085;
      font-size:14px;
      font-weight:900;
      text-align:center;
    }

    .round-actions{display:grid;gap:6px;margin-top:2px;}

    .modal-backdrop{
      position:fixed;
      inset:0;
      background:rgba(16,24,40,.52);
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      z-index:9999;
    }

    .modal-backdrop.show{display:flex;}

    .modal{
      width:min(520px,100%);
      background:#fff;
      border-radius:24px;
      padding:16px;
      box-shadow:0 24px 70px rgba(0,0,0,.28);
      color:#102033;
    }

    .modal-title{
      margin:0;
      color:#063b72;
      font-size:22px;
      font-weight:1000;
      letter-spacing:-.03em;
    }

    .modal-sub{
      margin:6px 0 14px;
      color:#667085;
      font-size:13px;
      font-weight:800;
      line-height:1.35;
    }

    .edit-grid{
      display:grid;
      gap:10px;
    }

    .edit-field{
      display:grid;
      gap:5px;
    }

    .edit-field label{
      font-size:12px;
      font-weight:1000;
      color:#063b72;
      text-transform:uppercase;
    }

    .edit-select{
      width:100%;
      min-height:42px;
      border-radius:14px;
      border:1px solid rgba(16,24,40,.14);
      padding:8px 10px;
      font-size:15px;
      font-weight:900;
      background:#f8fafc;
      color:#102033;
    }

    .modal-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:14px;
    }

    @media(min-width:760px){
      main{padding-top:14px;}
      .actions-grid{grid-template-columns:1fr 1fr 1fr;}
      .rounds-list{grid-template-columns:1fr 1fr;}
    }
  </style>
</head>

<body data-page="programmation" data-step="etape-1">

<div id="adminHeader"></div>

<main class="container">

  <section class="section" id="accessDenied" style="display:none;">
    <div class="summer-panel compact-panel">
      <h1 class="summer-panel-title">⛔ Accès refusé</h1>
      <p class="summer-panel-text">Cette page est réservée aux organisateurs.</p>
    </div>
  </section>

  <section class="section" id="pageContent" style="display:none;">
    <div class="summer-panel compact-panel">
      <div class="summer-panel-head">
        <div>
          <h1 class="summer-panel-title">Programmation</h1>
          <p class="summer-panel-text">Génère les tours, modifie les joueurs et valide les matchs.</p>
        </div>
        <div class="summer-pill">Étape 1</div>
      </div>

      <div class="actions-grid">
        <button class="admin-btn green" id="btnInitial" type="button">🚀 Générer les 2 premiers tours</button>
        <button class="admin-btn yellow" id="btnNext" type="button">➕ Générer un nouveau tour</button>
        <button class="admin-btn red" id="btnReset" type="button">♻️ Réinitialiser</button>
      </div>

      <div class="admin-status" id="statusMsg" style="margin-top:10px;">Chargement…</div>
    </div>
  </section>

  <section class="section" id="currentSection" style="display:none;">
    <div class="summer-panel compact-panel">
      <h2 class="section-title">🔥 Tours en cours / à venir</h2>
      <div id="currentList" class="rounds-list"></div>
    </div>
  </section>

  <section class="section" id="doneSection" style="display:none;">
    <div class="summer-panel compact-panel">
      <h2 class="section-title">✅ Tours terminés</h2>
      <div id="doneList" class="rounds-list"></div>
    </div>
  </section>

</main>

<div id="editModal" class="modal-backdrop">
  <div class="modal">
    <h2 class="modal-title">Modifier le match</h2>
    <p class="modal-sub">
      Le joueur remplacé prend automatiquement la place du joueur sélectionné.
    </p>

    <div id="editFields" class="edit-grid"></div>

    <div class="modal-actions">
      <button id="btnCancelEdit" class="admin-btn yellow" type="button">Annuler</button>
      <button id="btnSaveEdit" class="admin-btn green" type="button">Enregistrer</button>
    </div>
  </div>
</div>

<script type="module" src="../assets/js/header-admin.js"></script>

<script type="module">
  import { auth, db } from "../assets/js/firebase.js?v=admin-prog-americano-3";
  import { getRoleByUid } from "../assets/js/session.js?v=admin-prog-americano-3";

  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

  import {
    collection,
    doc,
    getDocs,
    onSnapshot,
    setDoc,
    updateDoc,
    deleteDoc,
    query,
    orderBy,
    serverTimestamp,
    writeBatch
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const EVENT_ID = "suzini-summer-tour-2026";
  const STEP_ID = "etape-1";
  const COURTS = ["Lisa de Los Pimentos", "Manon Queen Bee"];

  const accessDenied = document.getElementById("accessDenied");
  const pageContent = document.getElementById("pageContent");
  const currentSection = document.getElementById("currentSection");
  const doneSection = document.getElementById("doneSection");

  const statusMsg = document.getElementById("statusMsg");
  const btnInitial = document.getElementById("btnInitial");
  const btnNext = document.getElementById("btnNext");
  const btnReset = document.getElementById("btnReset");

  const currentList = document.getElementById("currentList");
  const doneList = document.getElementById("doneList");

  const editModal = document.getElementById("editModal");
  const editFields = document.getElementById("editFields");
  const btnCancelEdit = document.getElementById("btnCancelEdit");
  const btnSaveEdit = document.getElementById("btnSaveEdit");

  const playersRef = collection(db, "events", EVENT_ID, "steps", STEP_ID, "players");
  const roundsRef = collection(db, "events", EVENT_ID, "steps", STEP_ID, "rounds");
  const configRef = doc(db, "events", EVENT_ID, "steps", STEP_ID, "config", "programmation");

  let players = [];
  let rounds = [];
  let config = {};
  let unsubPlayers = null;
  let unsubRounds = null;
  let unsubConfig = null;
  let editing = null;

  function esc(value){
    return String(value || "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function isActivePlayer(data){
    return data.publicList === "active" || data.status === "active";
  }

  function playerName(id){
    const p = players.find(x => x.id === id);
    return p?.nickname || "Joueur";
  }

  function activePlayers(){
    return players
      .filter(p => p.active)
      .sort((a,b) => a.nickname.localeCompare(b.nickname, "fr", { sensitivity:"base", numeric:true }));
  }

  function teamName(team){
    if(!Array.isArray(team) || team.length < 2) return "Équipe";
    return `${playerName(team[0])} / ${playerName(team[1])}`;
  }

  function allMatches(){
    return rounds.flatMap(round =>
      (round.matches || []).map(match => ({
        ...match,
        roundId: round.id,
        roundNumber: round.roundNumber,
        bench: round.bench || []
      }))
    );
  }

  function completedMatches(){
    return allMatches().filter(m => m.status === "completed");
  }

  function pendingMatches(){
    return allMatches().filter(m => m.status !== "completed");
  }

  function updateStatsFromRounds(){
    const stats = new Map();

    players.forEach(p => {
      stats.set(p.id, {
        activeTurns:0,
        played:0,
        bench:0,
        partners:new Map(),
        opponents:new Map()
      });
    });

    rounds.forEach(round => {
      const roundPlayers = new Set();

      (round.matches || []).forEach(match => {
        [...match.teamA, ...match.teamB].forEach(id => roundPlayers.add(id));
      });

      (round.bench || []).forEach(id => roundPlayers.add(id));

      roundPlayers.forEach(id => {
        if(stats.has(id)) stats.get(id).activeTurns++;
      });

      (round.bench || []).forEach(id => {
        if(stats.has(id)) stats.get(id).bench++;
      });

      (round.matches || []).forEach(match => {
        const [a1,a2] = match.teamA;
        const [b1,b2] = match.teamB;

        [...match.teamA, ...match.teamB].forEach(id => {
          if(stats.has(id)) stats.get(id).played++;
        });

        addPartner(stats, a1, a2);
        addPartner(stats, b1, b2);

        match.teamA.forEach(a => {
          match.teamB.forEach(b => {
            addOpponent(stats, a, b);
            addOpponent(stats, b, a);
          });
        });
      });
    });

    return stats;
  }

  function addPartner(stats, a, b){
    if(!stats.has(a) || !stats.has(b)) return;
    stats.get(a).partners.set(b, (stats.get(a).partners.get(b) || 0) + 1);
    stats.get(b).partners.set(a, (stats.get(b).partners.get(a) || 0) + 1);
  }

  function addOpponent(stats, a, b){
    if(!stats.has(a)) return;
    stats.get(a).opponents.set(b, (stats.get(a).opponents.get(b) || 0) + 1);
  }

  function shuffle(array){
    return [...array].sort(() => Math.random() - .5);
  }

  function choosePlayersForRound(activePlayersList){
    const stats = updateStatsFromRounds();

    const ranked = [...activePlayersList].sort((a,b) => {
      const sa = stats.get(a.id) || {};
      const sb = stats.get(b.id) || {};
      const ratioA = (sa.played || 0) / Math.max(1, (sa.activeTurns || 0));
      const ratioB = (sb.played || 0) / Math.max(1, (sb.activeTurns || 0));

      if(ratioA !== ratioB) return ratioA - ratioB;
      if((sa.played || 0) !== (sb.played || 0)) return (sa.played || 0) - (sb.played || 0);
      return Math.random() - .5;
    });

    const playingCount = ranked.length >= 8 ? 8 : ranked.length >= 4 ? 4 : 0;
    return {
      selected: ranked.slice(0, playingCount),
      bench: ranked.slice(playingCount).map(p => p.id)
    };
  }

  function scoreArrangement(ids){
    const stats = updateStatsFromRounds();
    const matches = [{ teamA:[ids[0], ids[1]], teamB:[ids[2], ids[3]] }];

    if(ids.length >= 8){
      matches.push({ teamA:[ids[4], ids[5]], teamB:[ids[6], ids[7]] });
    }

    let score = 0;

    matches.forEach(match => {
      const [a1,a2] = match.teamA;
      const [b1,b2] = match.teamB;

      score += (stats.get(a1)?.partners.get(a2) || 0) * 100;
      score += (stats.get(b1)?.partners.get(b2) || 0) * 100;

      match.teamA.forEach(a => {
        match.teamB.forEach(b => {
          score += (stats.get(a)?.opponents.get(b) || 0) * 40;
        });
      });
    });

    return score;
  }

  function buildRound(activePlayersList){
    const { selected, bench } = choosePlayersForRound(activePlayersList);

    if(selected.length < 4){
      throw new Error("Il faut au moins 4 joueurs actifs pour générer un tour.");
    }

    let best = null;
    let bestScore = Infinity;

    for(let i = 0; i < 2000; i++){
      const ids = shuffle(selected.map(p => p.id));
      const score = scoreArrangement(ids);

      if(score < bestScore){
        bestScore = score;
        best = ids;
      }
    }

    const matches = [{
      matchIndex:0,
      court:COURTS[0],
      teamA:[best[0], best[1]],
      teamB:[best[2], best[3]],
      scoreA:null,
      scoreB:null,
      status:"pending"
    }];

    if(best.length >= 8){
      matches.push({
        matchIndex:1,
        court:COURTS[1],
        teamA:[best[4], best[5]],
        teamB:[best[6], best[7]],
        scoreA:null,
        scoreB:null,
        status:"pending"
      });
    }

    return { matches, bench };
  }

  async function generateOneRound(){
    const activePlayersList = players.filter(p => p.active);

    const roundNumber = rounds.length
      ? Math.max(...rounds.map(r => Number(r.roundNumber || 0))) + 1
      : 1;

    const round = buildRound(activePlayersList);
    const roundRef = doc(roundsRef);

    await setDoc(roundRef, {
      roundNumber,
      matches: round.matches,
      bench: round.bench,
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    });

    await setDoc(configRef, {
      lastGenerateCompletedCount: completedMatches().length,
      updatedAt: serverTimestamp()
    }, { merge:true });
  }

  async function generateInitial(){
    if(rounds.length > 0){
      alert("Des tours existent déjà.");
      return;
    }

    btnInitial.disabled = true;
    statusMsg.textContent = "Génération des 2 premiers tours…";

    try{
      await generateOneRound();
      await new Promise(resolve => setTimeout(resolve, 400));
      await refreshRoundsOnce();
      await generateOneRound();
      statusMsg.textContent = "✅ Deux premiers tours générés.";
    }catch(error){
      console.error(error);
      alert(error.message || "Génération impossible.");
      statusMsg.textContent = "Erreur de génération.";
    }finally{
      btnInitial.disabled = false;
    }
  }

  async function generateNext(){
    const done = completedMatches().length;
    const last = Number(config.lastGenerateCompletedCount || 0);

    if(rounds.length === 0){
      alert("Génère d’abord les 2 premiers tours.");
      return;
    }

    if(done <= last){
      alert("Valide au moins un nouveau match avant de générer un tour.");
      return;
    }

    btnNext.disabled = true;
    statusMsg.textContent = "Génération d’un nouveau tour…";

    try{
      await generateOneRound();
      statusMsg.textContent = "✅ Nouveau tour généré.";
    }catch(error){
      console.error(error);
      alert(error.message || "Génération impossible.");
      statusMsg.textContent = "Erreur de génération.";
    }finally{
      btnNext.disabled = false;
    }
  }

  async function resetProgrammation(){
    const ok1 = confirm("Réinitialiser toute la programmation ? Les statistiques et le classement repartiront à zéro.");
    if(!ok1) return;

    const ok2 = confirm("Confirmation définitive : supprimer tous les tours et résultats ?");
    if(!ok2) return;

    btnReset.disabled = true;
    statusMsg.textContent = "Réinitialisation…";

    try{
      const snap = await getDocs(roundsRef);
      const batch = writeBatch(db);

      snap.forEach(d => batch.delete(d.ref));
      batch.delete(configRef);

      await batch.commit();

      statusMsg.textContent = "✅ Programmation réinitialisée.";
    }catch(error){
      console.error(error);
      alert("Réinitialisation impossible.");
      statusMsg.textContent = "Erreur de réinitialisation.";
    }finally{
      btnReset.disabled = false;
    }
  }

  async function refreshRoundsOnce(){
    const snap = await getDocs(query(roundsRef, orderBy("roundNumber", "asc")));
    rounds = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  }

  function isCompleted(match){ return match?.status === "completed"; }

  function roundCompleted(round){
    const matches = round.matches || [];
    return matches.length > 0 && matches.every(isCompleted);
  }

  function roundPending(round){
    return (round.matches || []).some(match => !isCompleted(match));
  }

  function matchState(match){
    if(isCompleted(match)) return "Terminé";
    return "À jouer";
  }

  function matchPillClass(match){
    if(isCompleted(match)) return "done";
    return "current";
  }

  function courtClass(court){
    if(String(court || "").includes("Lisa")) return "court-lisa";
    if(String(court || "").includes("Manon")) return "court-manon";
    return "";
  }

  function courtOrder(match){
    const court = String(match?.court || "");
    if(court.includes("Lisa")) return 1;
    if(court.includes("Manon")) return 2;
    return 9;
  }

  function sortedMatches(round){
    return [...(round.matches || [])].sort((a,b) => {
      const courtDiff = courtOrder(a) - courtOrder(b);
      if(courtDiff !== 0) return courtDiff;
      return Number(a.matchIndex || 0) - Number(b.matchIndex || 0);
    });
  }

  function renderCourt(match, roundId){
    const done = isCompleted(match);
    const cls = courtClass(match.court);

    return `
      <div class="court-block ${esc(cls)}">
        <div class="court-head">
          <div class="court-name">${esc(match.court || "Terrain")}</div>

          <button
            class="edit-btn"
            type="button"
            data-action="edit-match"
            data-round="${esc(roundId)}"
            data-index="${esc(match.matchIndex)}"
            title="Modifier les joueurs">
            ⚙️
          </button>

          <div class="match-pill ${matchPillClass(match)}">${esc(matchState(match))}</div>
        </div>

        <div class="team-row">
          <div class="team-name">${esc(teamName(match.teamA))}</div>
          <input class="score-input" type="number" min="0" max="99" inputmode="numeric"
            value="${match.scoreA ?? ""}" data-score="A" data-round="${roundId}" data-index="${match.matchIndex}" ${done ? "disabled" : ""}>
        </div>

        <div class="team-row">
          <div class="team-name">${esc(teamName(match.teamB))}</div>
          <input class="score-input" type="number" min="0" max="99" inputmode="numeric"
            value="${match.scoreB ?? ""}" data-score="B" data-round="${roundId}" data-index="${match.matchIndex}" ${done ? "disabled" : ""}>
        </div>

        ${
          done
          ? ""
          : `<div class="round-actions">
              <button class="admin-btn green" type="button" data-action="validate" data-round="${roundId}" data-index="${match.matchIndex}">
                ✅ Valider
              </button>
            </div>`
        }
      </div>
    `;
  }

  function renderRound(round){
    const matches = sortedMatches(round);

    return `
      <div class="round-card">
        <div class="round-title">Tour ${esc(round.roundNumber)}</div>
        ${matches.map(match => renderCourt(match, round.id)).join("")}
      </div>
    `;
  }

  function render(){
    const pendingRounds = rounds
      .filter(roundPending)
      .sort((a,b) => Number(a.roundNumber) - Number(b.roundNumber));

    const doneRounds = rounds
      .filter(roundCompleted)
      .sort((a,b) => Number(b.roundNumber) - Number(a.roundNumber));

    currentList.innerHTML = pendingRounds.length
      ? pendingRounds.map(renderRound).join("")
      : `<div class="empty">Aucun tour en cours.</div>`;

    doneList.innerHTML = doneRounds.length
      ? doneRounds.map(renderRound).join("")
      : `<div class="empty">Aucun tour terminé.</div>`;

    const activeCount = players.filter(p => p.active).length;
    const completedCount = completedMatches().length;
    const pendingCount = pendingMatches().length;
    const last = Number(config.lastGenerateCompletedCount || 0);

    btnInitial.disabled = rounds.length > 0 || activeCount < 4;
    btnNext.disabled = rounds.length === 0 || completedCount <= last || activeCount < 4;

    statusMsg.textContent =
      `${activeCount} joueur(s) actif(s) — ${rounds.length} tour(s) — ${pendingCount} match(s) à jouer — ${completedCount} validé(s).`;
  }

  async function validateMatch(roundId, matchIndex){
    const round = rounds.find(r => r.id === roundId);
    if(!round) return;

    const inputs = document.querySelectorAll(`[data-round="${roundId}"][data-index="${matchIndex}"][data-score]`);

    const scoreA = Number(Array.from(inputs).find(i => i.dataset.score === "A")?.value);
    const scoreB = Number(Array.from(inputs).find(i => i.dataset.score === "B")?.value);

    if(!Number.isInteger(scoreA) || !Number.isInteger(scoreB) || scoreA < 0 || scoreA > 99 || scoreB < 0 || scoreB > 99){
      alert("Score invalide. Chaque score doit être compris entre 0 et 99.");
      return;
    }

    if(scoreA === scoreB){
      alert("Le score ne peut pas être égal.");
      return;
    }

    const matches = [...(round.matches || [])];
    const idx = matches.findIndex(m => Number(m.matchIndex) === Number(matchIndex));
    if(idx < 0) return;

    matches[idx] = {
      ...matches[idx],
      scoreA,
      scoreB,
      status:"completed",
      winner: scoreA > scoreB ? "A" : "B",
      completedAt: new Date()
    };

    await updateDoc(doc(db, "events", EVENT_ID, "steps", STEP_ID, "rounds", roundId), {
      matches,
      updatedAt: serverTimestamp()
    });
  }

  function openEditModal(roundId, matchIndex){
    const round = rounds.find(r => r.id === roundId);
    if(!round) return;

    const match = (round.matches || []).find(m => Number(m.matchIndex) === Number(matchIndex));
    if(!match) return;

    editing = {
      roundId,
      matchIndex:Number(matchIndex),
      original:[
        match.teamA[0],
        match.teamA[1],
        match.teamB[0],
        match.teamB[1]
      ]
    };

    const options = activePlayers().map(p => `
      <option value="${esc(p.id)}">${esc(p.nickname)}</option>
    `).join("");

    const labels = [
      "Équipe A — Joueur 1",
      "Équipe A — Joueur 2",
      "Équipe B — Joueur 1",
      "Équipe B — Joueur 2"
    ];

    editFields.innerHTML = editing.original.map((id, index) => `
      <div class="edit-field">
        <label>${esc(labels[index])}</label>
        <select class="edit-select" data-edit-slot="${index}">
          ${options}
        </select>
      </div>
    `).join("");

    editFields.querySelectorAll("[data-edit-slot]").forEach(select => {
      const index = Number(select.dataset.editSlot);
      select.value = editing.original[index];
    });

    editModal.classList.add("show");
  }

  function closeEditModal(){
    editModal.classList.remove("show");
    editing = null;
    editFields.innerHTML = "";
  }

  function swapPlayerInRound(round, oldId, newId){
    const matches = (round.matches || []).map(match => {
      const teamA = [...(match.teamA || [])];
      const teamB = [...(match.teamB || [])];

      for(let i = 0; i < teamA.length; i++){
        if(teamA[i] === newId) teamA[i] = oldId;
      }

      for(let i = 0; i < teamB.length; i++){
        if(teamB[i] === newId) teamB[i] = oldId;
      }

      return { ...match, teamA, teamB };
    });

    const bench = [...(round.bench || [])].map(id => id === newId ? oldId : id);

    return { matches, bench };
  }

  async function saveEditModal(){
    if(!editing) return;

    const round = rounds.find(r => r.id === editing.roundId);
    if(!round) return;

    let matches = (round.matches || []).map(m => ({
      ...m,
      teamA:[...(m.teamA || [])],
      teamB:[...(m.teamB || [])]
    }));

    let bench = [...(round.bench || [])];

    const idx = matches.findIndex(m => Number(m.matchIndex) === Number(editing.matchIndex));
    if(idx < 0) return;

    const selected = Array.from(editFields.querySelectorAll("[data-edit-slot]"))
      .sort((a,b) => Number(a.dataset.editSlot) - Number(b.dataset.editSlot))
      .map(select => select.value);

    if(new Set(selected).size !== selected.length){
      alert("Un même joueur ne peut pas être sélectionné plusieurs fois dans le match.");
      return;
    }

    for(let slot = 0; slot < 4; slot++){
      const oldId = editing.original[slot];
      const newId = selected[slot];

      if(oldId === newId) continue;

      const tempRound = { matches, bench };
      const swapped = swapPlayerInRound(tempRound, oldId, newId);
      matches = swapped.matches;
      bench = swapped.bench;

      if(slot === 0) matches[idx].teamA[0] = newId;
      if(slot === 1) matches[idx].teamA[1] = newId;
      if(slot === 2) matches[idx].teamB[0] = newId;
      if(slot === 3) matches[idx].teamB[1] = newId;
    }

    await updateDoc(doc(db, "events", EVENT_ID, "steps", STEP_ID, "rounds", editing.roundId), {
      matches,
      bench,
      updatedAt: serverTimestamp()
    });

    closeEditModal();
  }

  document.addEventListener("click", async (event) => {
    const validateBtn = event.target.closest("[data-action='validate']");
    if(validateBtn){
      validateBtn.disabled = true;

      try{
        await validateMatch(validateBtn.dataset.round, validateBtn.dataset.index);
      }catch(error){
        console.error(error);
        alert("Validation impossible.");
      }finally{
        validateBtn.disabled = false;
      }

      return;
    }

    const editBtn = event.target.closest("[data-action='edit-match']");
    if(editBtn){
      openEditModal(editBtn.dataset.round, editBtn.dataset.index);
    }
  });

  btnInitial.onclick = generateInitial;
  btnNext.onclick = generateNext;
  btnReset.onclick = resetProgrammation;
  btnCancelEdit.onclick = closeEditModal;
  btnSaveEdit.onclick = saveEditModal;

  editModal.addEventListener("click", (event) => {
    if(event.target === editModal) closeEditModal();
  });

  function startListeners(){
    unsubPlayers = onSnapshot(query(playersRef, orderBy("createdAt", "asc")), (snap) => {
      players = snap.docs.map(d => {
        const data = d.data() || {};
        return {
          id:d.id,
          nickname:data.surnom || data.nickname || "Sans surnom",
          active:isActivePlayer(data)
        };
      });
      render();
    });

    unsubRounds = onSnapshot(query(roundsRef, orderBy("roundNumber", "asc")), (snap) => {
      rounds = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      render();
    });

    unsubConfig = onSnapshot(configRef, (snap) => {
      config = snap.exists() ? (snap.data() || {}) : {};
      render();
    });
  }

  function stopListeners(){
    [unsubPlayers, unsubRounds, unsubConfig].forEach(fn => {
      if(fn) fn();
    });

    unsubPlayers = null;
    unsubRounds = null;
    unsubConfig = null;
  }

  onAuthStateChanged(auth, async (user) => {
    accessDenied.style.display = "none";
    pageContent.style.display = "none";
    currentSection.style.display = "none";
    doneSection.style.display = "none";
    stopListeners();

    if(!user){
      accessDenied.style.display = "block";
      return;
    }

    try{
      const role = await getRoleByUid(user.uid);

      if(!["admin", "jat"].includes(role)){
        accessDenied.style.display = "block";
        return;
      }

      pageContent.style.display = "block";
      currentSection.style.display = "block";
      doneSection.style.display = "block";

      startListeners();

    }catch(error){
      console.error(error);
      accessDenied.style.display = "block";
    }
  });
</script>

</body>
</html>
