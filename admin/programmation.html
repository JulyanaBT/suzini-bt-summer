<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Programmation</title>

  <link rel="stylesheet" href="../assets/css/style.css" />

  <style>
    main{padding-top:12px;}

    .admin-status{
      margin-top:10px;
      padding:12px 14px;
      border-radius:16px;
      background:#fff;
      color:#102033;
      font-size:14px;
      font-weight:900;
      line-height:1.35;
    }

    .actions-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:8px;
      margin-top:12px;
    }

    .admin-btn{
      min-height:46px;
      border:0;
      border-radius:16px;
      padding:10px 12px;
      font-size:14px;
      font-weight:1000;
      cursor:pointer;
      background:#063b72;
      color:#fff;
    }

    .admin-btn.green{background:#0b7a3b;}
    .admin-btn.yellow{background:#ffd84d;color:#102033;}
    .admin-btn.red{background:#9b1c1c;}
    .admin-btn:disabled{opacity:.55;cursor:not-allowed;}

    .round-list{
      display:grid;
      gap:12px;
    }

    .match-card{
      background:#fff;
      color:#102033;
      border-radius:18px;
      padding:13px;
      display:grid;
      gap:10px;
      box-shadow:0 8px 18px rgba(16,24,40,.10);
      border:1px solid rgba(16,24,40,.08);
    }

    .match-card.done{
      opacity:.86;
      background:#f8fafc;
    }

    .match-head{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
    }

    .match-title{
      font-size:18px;
      font-weight:1000;
      color:#063b72;
      line-height:1.1;
    }

    .match-sub{
      margin-top:4px;
      font-size:13px;
      font-weight:900;
      color:#667085;
    }

    .match-pill{
      flex-shrink:0;
      padding:6px 10px;
      border-radius:999px;
      font-size:11px;
      font-weight:1000;
      text-transform:uppercase;
      background:#fff7d6;
      color:#102033;
    }

    .match-pill.done{
      background:#d9fbe8;
      color:#087a35;
    }

    .teams{
      display:grid;
      gap:8px;
    }

    .team-row{
      display:grid;
      grid-template-columns:1fr 70px;
      gap:8px;
      align-items:center;
    }

    .team-name{
      min-height:44px;
      border-radius:15px;
      padding:10px 12px;
      background:#f8fafc;
      font-weight:1000;
      color:#102033;
      display:flex;
      align-items:center;
    }

    .score-input{
      width:100%;
      min-height:44px;
      border:1px solid rgba(16,24,40,.14);
      border-radius:15px;
      padding:8px 10px;
      font-size:18px;
      font-weight:1000;
      text-align:center;
      color:#102033;
      background:#fff;
    }

    .bench{
      padding:10px 12px;
      border-radius:16px;
      background:#fff7d6;
      color:#102033;
      font-size:13px;
      font-weight:900;
      line-height:1.35;
    }

    .section-title{
      margin:0 0 10px;
      font-size:22px;
      color:#063b72;
      font-weight:1000;
      letter-spacing:-.03em;
    }

    @media(min-width:760px){
      main{padding-top:18px;}
      .actions-grid{grid-template-columns:1fr 1fr;}
    }
  </style>
</head>

<body data-page="programmation" data-step="etape-1">

<div id="adminHeader"></div>

<main class="container">

  <section class="section" id="accessDenied" style="display:none;">
    <div class="summer-panel">
      <h1 class="summer-panel-title">⛔ Accès refusé</h1>
      <p class="summer-panel-text">Cette page est réservée aux organisateurs.</p>
    </div>
  </section>

  <section class="section" id="pageContent" style="display:none;">
    <div class="summer-panel">
      <div class="summer-panel-head">
        <div>
          <h1 class="summer-panel-title">Programmation</h1>
          <p class="summer-panel-text">
            Génère les tours, saisis les scores et valide les matchs de l’Americano.
          </p>
        </div>
        <div class="summer-pill">Étape 1</div>
      </div>

      <div class="actions-grid">
        <button class="admin-btn green" id="btnInitial" type="button">
          🚀 Générer les 2 premiers tours
        </button>

        <button class="admin-btn yellow" id="btnNext" type="button">
          ➕ Générer un nouveau tour
        </button>
      </div>

      <div class="admin-status" id="statusMsg">
        Chargement…
      </div>
    </div>
  </section>

  <section class="section" id="currentSection" style="display:none;">
    <div class="summer-panel">
      <h2 class="section-title">🔥 Matchs en cours / à jouer</h2>
      <div id="currentList" class="round-list"></div>
    </div>
  </section>

  <section class="section" id="doneSection" style="display:none;">
    <div class="summer-panel">
      <h2 class="section-title">✅ Matchs terminés</h2>
      <div id="doneList" class="round-list"></div>
    </div>
  </section>

</main>

<script type="module" src="../assets/js/header-admin.js"></script>

<script type="module">
  import { auth, db } from "../assets/js/firebase.js?v=admin-prog-americano-1";
  import { getRoleByUid } from "../assets/js/session.js?v=admin-prog-americano-1";

  import {
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

  import {
    collection,
    doc,
    getDocs,
    onSnapshot,
    setDoc,
    updateDoc,
    writeBatch,
    query,
    orderBy,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const EVENT_ID = "suzini-summer-tour-2026";
  const STEP_ID = "etape-1";

  const COURTS = ["Lisa de Los Pimentos", "Manon Queen Bee"];

  const accessDenied = document.getElementById("accessDenied");
  const pageContent = document.getElementById("pageContent");
  const currentSection = document.getElementById("currentSection");
  const doneSection = document.getElementById("doneSection");

  const statusMsg = document.getElementById("statusMsg");
  const btnInitial = document.getElementById("btnInitial");
  const btnNext = document.getElementById("btnNext");

  const currentList = document.getElementById("currentList");
  const doneList = document.getElementById("doneList");

  const playersRef = collection(db, "events", EVENT_ID, "steps", STEP_ID, "players");
  const roundsRef = collection(db, "events", EVENT_ID, "steps", STEP_ID, "rounds");
  const configRef = doc(db, "events", EVENT_ID, "steps", STEP_ID, "config", "programmation");

  let players = [];
  let rounds = [];
  let config = {};
  let unsubPlayers = null;
  let unsubRounds = null;
  let unsubConfig = null;

  function esc(value){
    return String(value || "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function isActivePlayer(data){
    return data.publicList === "active" || data.status === "active";
  }

  function playerName(id){
    const p = players.find(x => x.id === id);
    return p?.nickname || "Joueur";
  }

  function teamName(team){
    return `${playerName(team[0])} / ${playerName(team[1])}`;
  }

  function allMatches(){
    return rounds.flatMap(round =>
      (round.matches || []).map(match => ({
        ...match,
        roundId: round.id,
        roundNumber: round.roundNumber,
        bench: round.bench || []
      }))
    );
  }

  function completedMatches(){
    return allMatches().filter(m => m.status === "completed");
  }

  function pendingMatches(){
    return allMatches().filter(m => m.status !== "completed");
  }

  function pairKey(a,b){
    return [a,b].sort().join("__");
  }

  function updateStatsFromRounds(){
    const stats = new Map();

    players.forEach(p => {
      stats.set(p.id, {
        activeTurns:0,
        played:0,
        bench:0,
        partners:new Map(),
        opponents:new Map()
      });
    });

    rounds.forEach(round => {
      const roundPlayers = new Set();

      (round.matches || []).forEach(match => {
        [...match.teamA, ...match.teamB].forEach(id => roundPlayers.add(id));
      });

      (round.bench || []).forEach(id => roundPlayers.add(id));

      roundPlayers.forEach(id => {
        if(stats.has(id)) stats.get(id).activeTurns++;
      });

      (round.bench || []).forEach(id => {
        if(stats.has(id)) stats.get(id).bench++;
      });

      (round.matches || []).forEach(match => {
        const [a1,a2] = match.teamA;
        const [b1,b2] = match.teamB;

        [...match.teamA, ...match.teamB].forEach(id => {
          if(stats.has(id)) stats.get(id).played++;
        });

        addPartner(stats, a1, a2);
        addPartner(stats, b1, b2);

        match.teamA.forEach(a => {
          match.teamB.forEach(b => {
            addOpponent(stats, a, b);
            addOpponent(stats, b, a);
          });
        });
      });
    });

    return stats;
  }

  function addPartner(stats, a, b){
    if(!stats.has(a) || !stats.has(b)) return;
    stats.get(a).partners.set(b, (stats.get(a).partners.get(b) || 0) + 1);
    stats.get(b).partners.set(a, (stats.get(b).partners.get(a) || 0) + 1);
  }

  function addOpponent(stats, a, b){
    if(!stats.has(a)) return;
    stats.get(a).opponents.set(b, (stats.get(a).opponents.get(b) || 0) + 1);
  }

  function shuffle(array){
    return [...array].sort(() => Math.random() - .5);
  }

  function choosePlayersForRound(activePlayers){
    const stats = updateStatsFromRounds();

    const ranked = [...activePlayers].sort((a,b) => {
      const sa = stats.get(a.id) || {};
      const sb = stats.get(b.id) || {};

      const ratioA = (sa.played || 0) / Math.max(1, (sa.activeTurns || 0));
      const ratioB = (sb.played || 0) / Math.max(1, (sb.activeTurns || 0));

      if(ratioA !== ratioB) return ratioA - ratioB;
      if((sa.played || 0) !== (sb.played || 0)) return (sa.played || 0) - (sb.played || 0);
      return Math.random() - .5;
    });

    const playingCount = ranked.length >= 8 ? 8 : ranked.length >= 4 ? 4 : 0;
    const selected = ranked.slice(0, playingCount);
    const bench = ranked.slice(playingCount).map(p => p.id);

    return { selected, bench };
  }

  function scoreArrangement(ids){
    const stats = updateStatsFromRounds();

    const matches = [
      {
        teamA:[ids[0], ids[1]],
        teamB:[ids[2], ids[3]]
      }
    ];

    if(ids.length >= 8){
      matches.push({
        teamA:[ids[4], ids[5]],
        teamB:[ids[6], ids[7]]
      });
    }

    let score = 0;

    matches.forEach(match => {
      const [a1,a2] = match.teamA;
      const [b1,b2] = match.teamB;

      score += (stats.get(a1)?.partners.get(a2) || 0) * 100;
      score += (stats.get(b1)?.partners.get(b2) || 0) * 100;

      match.teamA.forEach(a => {
        match.teamB.forEach(b => {
          score += (stats.get(a)?.opponents.get(b) || 0) * 40;
        });
      });
    });

    return score;
  }

  function buildRound(activePlayers){
    const { selected, bench } = choosePlayersForRound(activePlayers);

    if(selected.length < 4){
      throw new Error("Il faut au moins 4 joueurs actifs pour générer un tour.");
    }

    let best = null;
    let bestScore = Infinity;

    for(let i = 0; i < 2000; i++){
      const ids = shuffle(selected.map(p => p.id));
      const score = scoreArrangement(ids);

      if(score < bestScore){
        bestScore = score;
        best = ids;
      }
    }

    const matches = [
      {
        matchIndex:0,
        court:COURTS[0],
        teamA:[best[0], best[1]],
        teamB:[best[2], best[3]],
        scoreA:null,
        scoreB:null,
        status:"pending"
      }
    ];

    if(best.length >= 8){
      matches.push({
        matchIndex:1,
        court:COURTS[1],
        teamA:[best[4], best[5]],
        teamB:[best[6], best[7]],
        scoreA:null,
        scoreB:null,
        status:"pending"
      });
    }

    return { matches, bench };
  }

  async function generateOneRound(){
    const activePlayers = players.filter(p => p.active);

    const roundNumber = rounds.length
      ? Math.max(...rounds.map(r => Number(r.roundNumber || 0))) + 1
      : 1;

    const round = buildRound(activePlayers);

    const roundRef = doc(roundsRef);

    await setDoc(roundRef, {
      roundNumber,
      matches: round.matches,
      bench: round.bench,
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    });

    await setDoc(configRef, {
      lastGenerateCompletedCount: completedMatches().length,
      updatedAt: serverTimestamp()
    }, { merge:true });
  }

  async function generateInitial(){
    if(rounds.length > 0){
      alert("Des tours existent déjà.");
      return;
    }

    btnInitial.disabled = true;
    statusMsg.textContent = "Génération des 2 premiers tours…";

    try{
      await generateOneRound();
      await new Promise(resolve => setTimeout(resolve, 400));
      await refreshRoundsOnce();
      await generateOneRound();
      statusMsg.textContent = "✅ Deux premiers tours générés.";
    }catch(error){
      console.error(error);
      alert(error.message || "Génération impossible.");
      statusMsg.textContent = "Erreur de génération.";
    }finally{
      btnInitial.disabled = false;
    }
  }

  async function generateNext(){
    const done = completedMatches().length;
    const last = Number(config.lastGenerateCompletedCount || 0);

    if(rounds.length === 0){
      alert("Génère d’abord les 2 premiers tours.");
      return;
    }

    if(done <= last){
      alert("Valide au moins un nouveau match avant de générer un tour.");
      return;
    }

    btnNext.disabled = true;
    statusMsg.textContent = "Génération d’un nouveau tour…";

    try{
      await generateOneRound();
      statusMsg.textContent = "✅ Nouveau tour généré.";
    }catch(error){
      console.error(error);
      alert(error.message || "Génération impossible.");
      statusMsg.textContent = "Erreur de génération.";
    }finally{
      btnNext.disabled = false;
    }
  }

  async function refreshRoundsOnce(){
    const snap = await getDocs(query(roundsRef, orderBy("roundNumber", "asc")));
    rounds = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  }

  function renderMatch(match){
    const done = match.status === "completed";

    return `
      <div class="match-card ${done ? "done" : ""}">
        <div class="match-head">
          <div>
            <div class="match-title">Tour ${esc(match.roundNumber)} — ${esc(match.court)}</div>
            <div class="match-sub">${esc(teamName(match.teamA))} VS ${esc(teamName(match.teamB))}</div>
          </div>

          <div class="match-pill ${done ? "done" : ""}">
            ${done ? "Terminé" : "À jouer"}
          </div>
        </div>

        <div class="teams">
          <div class="team-row">
            <div class="team-name">${esc(teamName(match.teamA))}</div>
            <input
              class="score-input"
              type="number"
              min="0"
              max="99"
              inputmode="numeric"
              value="${match.scoreA ?? ""}"
              data-score="A"
              data-round="${match.roundId}"
              data-index="${match.matchIndex}"
              ${done ? "disabled" : ""}>
          </div>

          <div class="team-row">
            <div class="team-name">${esc(teamName(match.teamB))}</div>
            <input
              class="score-input"
              type="number"
              min="0"
              max="99"
              inputmode="numeric"
              value="${match.scoreB ?? ""}"
              data-score="B"
              data-round="${match.roundId}"
              data-index="${match.matchIndex}"
              ${done ? "disabled" : ""}>
          </div>
        </div>

        ${
          done
          ? ""
          : `<button class="admin-btn green" type="button" data-action="validate" data-round="${match.roundId}" data-index="${match.matchIndex}">
              ✅ Valider le match
            </button>`
        }
      </div>
    `;
  }

  function render(){
    const pending = pendingMatches()
      .sort((a,b) => Number(a.roundNumber) - Number(b.roundNumber) || Number(a.matchIndex) - Number(b.matchIndex));

    const done = completedMatches()
      .sort((a,b) => {
        const da = a.completedAt?.seconds || 0;
        const db = b.completedAt?.seconds || 0;
        return db - da;
      });

    currentList.innerHTML = pending.length
      ? pending.map(renderMatch).join("")
      : `<div class="admin-status">Aucun match en cours.</div>`;

    doneList.innerHTML = done.length
      ? done.map(renderMatch).join("")
      : `<div class="admin-status">Aucun match terminé.</div>`;

    const activeCount = players.filter(p => p.active).length;
    const completedCount = done.length;
    const last = Number(config.lastGenerateCompletedCount || 0);

    btnInitial.disabled = rounds.length > 0 || activeCount < 4;
    btnNext.disabled = rounds.length === 0 || completedCount <= last || activeCount < 4;

    statusMsg.textContent =
      `${activeCount} joueur(s) actif(s) — ${rounds.length} tour(s) généré(s) — ${completedCount} match(s) validé(s).`;
  }

  async function validateMatch(roundId, matchIndex){
    const round = rounds.find(r => r.id === roundId);
    if(!round) return;

    const inputs = document.querySelectorAll(`[data-round="${roundId}"][data-index="${matchIndex}"][data-score]`);

    const scoreA = Number(Array.from(inputs).find(i => i.dataset.score === "A")?.value);
    const scoreB = Number(Array.from(inputs).find(i => i.dataset.score === "B")?.value);

    if(!Number.isInteger(scoreA) || !Number.isInteger(scoreB) || scoreA < 0 || scoreA > 99 || scoreB < 0 || scoreB > 99){
      alert("Score invalide. Chaque score doit être compris entre 0 et 99.");
      return;
    }

    if(scoreA === scoreB){
      alert("Le score ne peut pas être égal.");
      return;
    }

    const matches = [...(round.matches || [])];
    const idx = matches.findIndex(m => Number(m.matchIndex) === Number(matchIndex));
    if(idx < 0) return;

    matches[idx] = {
      ...matches[idx],
      scoreA,
      scoreB,
      status:"completed",
      winner: scoreA > scoreB ? "A" : "B",
      completedAt: new Date()
    };

    await updateDoc(doc(db, "events", EVENT_ID, "steps", STEP_ID, "rounds", roundId), {
      matches,
      updatedAt: serverTimestamp()
    });
  }

  document.addEventListener("click", async (event) => {
    const btn = event.target.closest("[data-action='validate']");
    if(!btn) return;

    btn.disabled = true;

    try{
      await validateMatch(btn.dataset.round, btn.dataset.index);
    }catch(error){
      console.error(error);
      alert("Validation impossible.");
    }finally{
      btn.disabled = false;
    }
  });

  btnInitial.onclick = generateInitial;
  btnNext.onclick = generateNext;

  function startListeners(){
    unsubPlayers = onSnapshot(query(playersRef, orderBy("createdAt", "asc")), (snap) => {
      players = snap.docs.map(d => {
        const data = d.data() || {};
        return {
          id:d.id,
          nickname:data.surnom || data.nickname || "Sans surnom",
          active:isActivePlayer(data)
        };
      });
      render();
    });

    unsubRounds = onSnapshot(query(roundsRef, orderBy("roundNumber", "asc")), (snap) => {
      rounds = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      render();
    });

    unsubConfig = onSnapshot(configRef, (snap) => {
      config = snap.exists() ? (snap.data() || {}) : {};
      render();
    });
  }

  function stopListeners(){
    [unsubPlayers, unsubRounds, unsubConfig].forEach(fn => {
      if(fn) fn();
    });

    unsubPlayers = null;
    unsubRounds = null;
    unsubConfig = null;
  }

  onAuthStateChanged(auth, async (user) => {
    accessDenied.style.display = "none";
    pageContent.style.display = "none";
    currentSection.style.display = "none";
    doneSection.style.display = "none";
    stopListeners();

    if(!user){
      accessDenied.style.display = "block";
      return;
    }

    try{
      const role = await getRoleByUid(user.uid);

      if(!["admin", "jat"].includes(role)){
        accessDenied.style.display = "block";
        return;
      }

      pageContent.style.display = "block";
      currentSection.style.display = "block";
      doneSection.style.display = "block";

      startListeners();

    }catch(error){
      console.error(error);
      accessDenied.style.display = "block";
    }
  });
</script>

</body>
</html>
