<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Maintenance</title>

  <link rel="stylesheet" href="../assets/css/style.css" />

  <style>
    main{padding-top:12px;}

    .admin-status{
      margin-top:10px;
      padding:12px 14px;
      border-radius:16px;
      background:#fff;
      color:#102033;
      font-size:14px;
      font-weight:900;
      line-height:1.35;
    }

    .form-grid{
      display:grid;
      gap:12px;
    }

    .field{
      display:grid;
      gap:7px;
    }

    .field label{
      font-size:14px;
      font-weight:1000;
      color:#063b72;
    }

    .admin-input,
    .admin-textarea{
      width:100%;
      border:0;
      border-radius:16px;
      padding:12px 14px;
      background:#fff;
      color:#102033;
      font-size:15px;
      font-weight:800;
      box-shadow:0 6px 14px rgba(16,24,40,.08);
      font-family:inherit;
    }

    .admin-textarea{
      min-height:86px;
      resize:vertical;
      line-height:1.35;
    }

    .admin-btn{
      min-height:46px;
      border:0;
      border-radius:16px;
      padding:10px 12px;
      font-size:14px;
      font-weight:1000;
      cursor:pointer;
      background:#063b72;
      color:#fff;
      font-family:inherit;
    }

    .admin-btn.green{background:#0b7a3b;}
    .admin-btn.yellow{background:#ffd84d;color:#102033;}
    .admin-btn.red{background:#9b1c1c;}
    .admin-btn:disabled{opacity:.55;cursor:not-allowed;}

    .actions-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:8px;
      margin-top:12px;
    }

    .pages-grid{
      display:grid;
      gap:10px;
    }

    .page-toggle{
      background:#fff;
      color:#102033;
      border-radius:18px;
      padding:13px;
      display:grid;
      grid-template-columns:1fr auto;
      gap:12px;
      align-items:center;
      box-shadow:0 8px 18px rgba(16,24,40,.10);
      border:1px solid rgba(16,24,40,.08);
    }

    .page-title{
      font-size:16px;
      font-weight:1000;
      color:#063b72;
      line-height:1.1;
    }

    .page-key{
      margin-top:4px;
      font-size:12px;
      font-weight:800;
      color:#667085;
      line-height:1.2;
    }

    .switch{
      position:relative;
      width:58px;
      height:34px;
      flex:0 0 auto;
    }

    .switch input{
      opacity:0;
      width:0;
      height:0;
    }

    .slider{
      position:absolute;
      cursor:pointer;
      inset:0;
      background:#d0d5dd;
      border-radius:999px;
      transition:.2s;
      box-shadow:inset 0 0 0 1px rgba(16,24,40,.08);
    }

    .slider:before{
      content:"";
      position:absolute;
      width:28px;
      height:28px;
      left:3px;
      top:3px;
      background:white;
      border-radius:50%;
      transition:.2s;
      box-shadow:0 4px 10px rgba(16,24,40,.18);
    }

    .switch input:checked + .slider{
      background:#ff3e8a;
    }

    .switch input:checked + .slider:before{
      transform:translateX(24px);
    }

    .maintenance-global{
      background:linear-gradient(135deg,#fff7d6,#ffffff);
      border-color:rgba(255,196,0,.35);
    }

    .section-title{
      margin:0 0 10px;
      font-size:22px;
      color:#063b72;
      font-weight:1000;
      letter-spacing:-.03em;
    }

    @media(min-width:760px){
      main{padding-top:18px;}
      .actions-grid{grid-template-columns:1fr 1fr;}
      .pages-grid{grid-template-columns:1fr 1fr;}
    }
  </style>
</head>

<body data-page="maintenance" data-step="etape-1">

<div id="adminHeader"></div>

<main class="container">

  <section class="section" id="accessDenied" style="display:none;">
    <div class="summer-panel">
      <h1 class="summer-panel-title">⛔ Accès refusé</h1>
      <p class="summer-panel-text">Cette page est réservée aux administrateurs.</p>
    </div>
  </section>

  <section class="section" id="pageContent" style="display:none;">
    <div class="summer-panel">
      <div class="summer-panel-head">
        <div>
          <h1 class="summer-panel-title">Maintenance</h1>
          <p class="summer-panel-text">
            Choisis les pages publiques à masquer pendant les tests.
          </p>
        </div>
        <div class="summer-pill">Admin</div>
      </div>

      <div class="pages-grid">
        <div class="page-toggle maintenance-global">
          <div>
            <div class="page-title">Mode maintenance activable</div>
            <div class="page-key">Si désactivé, aucune page n’est bloquée.</div>
          </div>

          <label class="switch">
            <input id="enabledInput" type="checkbox">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="form-grid" style="margin-top:14px;">
        <div class="field">
          <label for="messageInput">Message affiché aux visiteurs</label>
          <textarea id="messageInput" class="admin-textarea">Page momentanément en maintenance. Merci de revenir dans quelques minutes.</textarea>
        </div>
      </div>

      <div class="actions-grid">
        <button id="btnSave" class="admin-btn green" type="button">
          💾 Enregistrer
        </button>

        <button id="btnAllOff" class="admin-btn yellow" type="button">
          ✅ Tout rendre public
        </button>
      </div>

      <div id="statusMsg" class="admin-status">
        Chargement…
      </div>
    </div>
  </section>

  <section class="section" id="pagesSection" style="display:none;">
    <div class="summer-panel">
      <h2 class="section-title">Pages publiques</h2>

      <div id="pagesList" class="pages-grid"></div>
    </div>
  </section>

</main>

<script type="module" src="../assets/js/header-admin.js"></script>

<script type="module">
  import { auth, db } from "../assets/js/firebase.js?v=admin-maintenance-1";
  import { getRoleByUid } from "../assets/js/session.js?v=admin-maintenance-1";

  import {
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

  import {
    doc,
    getDoc,
    setDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const accessDenied = document.getElementById("accessDenied");
  const pageContent = document.getElementById("pageContent");
  const pagesSection = document.getElementById("pagesSection");

  const enabledInput = document.getElementById("enabledInput");
  const messageInput = document.getElementById("messageInput");
  const pagesList = document.getElementById("pagesList");
  const btnSave = document.getElementById("btnSave");
  const btnAllOff = document.getElementById("btnAllOff");
  const statusMsg = document.getElementById("statusMsg");

  const maintenanceRef = doc(db, "settings", "maintenance");

  const pageItems = [
    { key:"index", label:"Accueil général" },
    { key:"evenements", label:"Tous les événements" },
    { key:"infos", label:"Infos" },
    { key:"reglement", label:"Règlement" },
    { key:"restauration", label:"Restauration" },
    { key:"acces", label:"Accès" },
    { key:"contacts", label:"Contacts" },

    { key:"etape-1/index", label:"Étape 1 — Accueil" },
    { key:"etape-1/inscriptions", label:"Étape 1 — Inscriptions" },
    { key:"etape-1/participants", label:"Étape 1 — Participants" },
    { key:"etape-1/programmation", label:"Étape 1 — Programmation" },
    { key:"etape-1/classement", label:"Étape 1 — Classement" },
    { key:"etape-1/statistiques", label:"Étape 1 — Statistiques" },

    { key:"etape-2/index", label:"Étape 2 — Accueil" },
    { key:"etape-3/index", label:"Étape 3 — Accueil" }
  ];

  let maintenanceData = {
    enabled:false,
    message:"Page momentanément en maintenance. Merci de revenir dans quelques minutes.",
    pages:{}
  };

  function esc(value){
    return String(value || "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function renderPages(){
    pagesList.innerHTML = pageItems.map(item => {
      const checked = maintenanceData.pages?.[item.key] === true ? "checked" : "";

      return `
        <div class="page-toggle">
          <div>
            <div class="page-title">${esc(item.label)}</div>
            <div class="page-key">${esc(item.key)}</div>
          </div>

          <label class="switch">
            <input type="checkbox" data-page-key="${esc(item.key)}" ${checked}>
            <span class="slider"></span>
          </label>
        </div>
      `;
    }).join("");
  }

  function applyData(){
    enabledInput.checked = maintenanceData.enabled === true;
    messageInput.value = maintenanceData.message || "Page momentanément en maintenance. Merci de revenir dans quelques minutes.";
    renderPages();
  }

  async function loadMaintenance(){
    statusMsg.textContent = "Chargement de la configuration…";

    const snap = await getDoc(maintenanceRef);

    if(snap.exists()){
      const data = snap.data() || {};

      maintenanceData = {
        enabled:data.enabled === true,
        message:data.message || maintenanceData.message,
        pages:data.pages || {}
      };
    }

    applyData();
    statusMsg.textContent = "Configuration chargée.";
  }

  function collectData(){
    const pages = {};

    document.querySelectorAll("[data-page-key]").forEach(input => {
      pages[input.dataset.pageKey] = input.checked === true;
    });

    return {
      enabled:enabledInput.checked === true,
      message:messageInput.value.trim() || "Page momentanément en maintenance. Merci de revenir dans quelques minutes.",
      pages,
      updatedAt:serverTimestamp()
    };
  }

  async function saveMaintenance(){
    btnSave.disabled = true;
    statusMsg.textContent = "Enregistrement…";

    try{
      const data = collectData();
      await setDoc(maintenanceRef, data, { merge:true });

      maintenanceData = {
        enabled:data.enabled,
        message:data.message,
        pages:data.pages
      };

      statusMsg.textContent = "✅ Configuration enregistrée.";
    }catch(error){
      console.error(error);
      statusMsg.textContent = "❌ Enregistrement impossible.";
    }finally{
      btnSave.disabled = false;
    }
  }

  btnSave.onclick = saveMaintenance;

  btnAllOff.onclick = () => {
    enabledInput.checked = false;

    document.querySelectorAll("[data-page-key]").forEach(input => {
      input.checked = false;
    });

    statusMsg.textContent = "Tout est repassé en public. Clique sur Enregistrer.";
  };

  onAuthStateChanged(auth, async (user) => {
    accessDenied.style.display = "none";
    pageContent.style.display = "none";
    pagesSection.style.display = "none";

    if(!user){
      accessDenied.style.display = "block";
      return;
    }

    try{
      const role = await getRoleByUid(user.uid);

      if(role !== "admin"){
        accessDenied.style.display = "block";
        return;
      }

      pageContent.style.display = "block";
      pagesSection.style.display = "block";

      await loadMaintenance();

    }catch(error){
      console.error(error);
      accessDenied.style.display = "block";
    }
  });
</script>

</body>
</html>
