<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Inscriptions Summer Tour</title>

  <link rel="stylesheet" href="../assets/css/style.css" />

  <style>
    main{padding-top:0;padding-bottom:24px;}
    .section{margin-top:10px;}
    .section:first-child{margin-top:0;}
    .compact-panel{padding:12px;border-radius:22px;}

    .admin-form{display:grid;gap:10px;}

    .admin-input{
      width:100%;
      min-height:48px;
      border:0;
      border-radius:16px;
      padding:12px 14px;
      font-size:16px;
      font-weight:800;
      background:#fff;
      color:#102033;
    }

    .admin-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:10px;
    }

    .admin-btn{
      min-height:42px;
      border:0;
      border-radius:14px;
      padding:9px 11px;
      font-size:13px;
      font-weight:1000;
      background:#063b72;
      color:#fff;
      cursor:pointer;
    }

    .admin-btn.pink{background:#ff3e8a;}
    .admin-btn.yellow{background:#ffd84d;color:#111;}
    .admin-btn.green{background:#0b7a3b;}
    .admin-btn.red{background:#9b1c1c;}
    .admin-btn:disabled{opacity:.55;cursor:not-allowed;}

    .admin-status{
      padding:10px 12px;
      border-radius:16px;
      background:#fff;
      color:#102033;
      font-size:13px;
      font-weight:900;
      line-height:1.35;
      box-shadow:0 6px 14px rgba(16,24,40,.08);
    }

    .stats-line{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }

    .stat-box{
      background:#fff;
      color:#063b72;
      border-radius:16px;
      padding:10px;
      text-align:center;
      font-weight:1000;
    }

    .stat-box strong{
      display:block;
      font-size:24px;
      line-height:1;
    }

    .stat-box span{
      display:block;
      margin-top:4px;
      font-size:10px;
      text-transform:uppercase;
      color:#667085;
    }

    .items-list{
      display:grid;
      gap:10px;
    }

    .item-card{
      background:#fff;
      color:#102033;
      border-radius:18px;
      padding:12px;
      display:grid;
      gap:8px;
      box-shadow:0 8px 18px rgba(16,24,40,.10);
    }

    .item-title{
      font-size:19px;
      font-weight:1000;
      color:#063b72;
      line-height:1.05;
    }

    .item-meta{
      font-size:13px;
      font-weight:850;
      color:#344054;
      line-height:1.35;
    }

    .item-actions{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .mini-btn{
      border:0;
      border-radius:999px;
      padding:8px 12px;
      font-size:12px;
      font-weight:1000;
      background:#ff3e8a;
      color:#fff;
      cursor:pointer;
    }

    .mini-btn.green{background:#0b7a3b;}
    .mini-btn.red{background:#9b1c1c;}
    .mini-btn.yellow{background:#ffd84d;color:#102033;}

    @media(min-width:760px){
      .admin-actions{grid-template-columns:repeat(4,1fr);}
      .items-list{grid-template-columns:1fr 1fr;}
    }
  </style>
</head>

<body data-page="inscriptions" data-step="etape-1">

<div id="adminHeader"></div>

<main class="container">

  <section class="section" id="loginSection">
    <div class="summer-panel compact-panel">
      <div class="summer-panel-head">
        <div>
          <h1 class="summer-panel-title">Connexion admin</h1>
          <p class="summer-panel-text">Connecte-toi pour gérer les inscriptions.</p>
        </div>
        <div class="summer-pill">Admin</div>
      </div>

      <form id="loginForm" class="admin-form">
        <input id="email" class="admin-input" type="email" placeholder="Email" required>
        <input id="password" class="admin-input" type="password" placeholder="Mot de passe" required>

        <button class="admin-btn" type="submit">🔐 Se connecter</button>

        <div id="loginMessage" class="admin-status">Non connecté.</div>
      </form>
    </div>
  </section>

  <section class="section" id="adminSection" style="display:none;">
    <div class="summer-panel compact-panel">
      <div class="summer-panel-head">
        <div>
          <h1 class="summer-panel-title">Gestion inscriptions</h1>
          <p class="summer-panel-text" id="pageSubtitle">
            Ouverture, suspension, clôture et suivi des inscriptions.
          </p>
        </div>
        <div class="summer-pill" id="stepLabel">Étape</div>
      </div>

      <div class="admin-status">
        <strong>Statut actuel :</strong>
        <span id="currentState">Chargement…</span>
      </div>

      <div class="admin-actions">
        <button class="admin-btn yellow" id="btnNotOpen" type="button">💤 Pas ouvertes</button>
        <button class="admin-btn green" id="btnOpen" type="button">✅ Ouvrir</button>
        <button class="admin-btn pink" id="btnPause" type="button">⏸️ Suspendre</button>
        <button class="admin-btn" id="btnClose" type="button">🔒 Clôturer</button>
      </div>

      <div id="statusMessage" class="admin-status" style="margin-top:10px;">—</div>
    </div>
  </section>

  <section class="section" id="statsSection" style="display:none;">
    <div class="summer-panel compact-panel">
      <div class="stats-line">
        <div class="stat-box">
          <strong id="countTotal">0</strong>
          <span>Total</span>
        </div>

        <div class="stat-box">
          <strong id="countRegistered">0</strong>
          <span>Inscrits</span>
        </div>

        <div class="stat-box">
          <strong id="countConfirmed">0</strong>
          <span>Confirmés</span>
        </div>
      </div>
    </div>
  </section>

  <section class="section" id="itemsSection" style="display:none;">
    <div class="summer-panel compact-panel">
      <div class="summer-panel-head">
        <div>
          <h2 class="summer-panel-title" id="listTitle">Inscriptions</h2>
          <p class="summer-panel-text" id="listText">Liste des inscriptions.</p>
        </div>
        <div class="summer-pill">Live</div>
      </div>

      <div id="itemsList" class="items-list">
        <div class="admin-status">Chargement…</div>
      </div>
    </div>
  </section>

</main>

<script type="module" src="../assets/js/header-admin.js"></script>

<script type="module">
  import { auth, db } from "../assets/js/firebase.js?v=admin-insc-summer-2";

  import {
    signInWithEmailAndPassword,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

  import {
    collection,
    doc,
    getDoc,
    onSnapshot,
    setDoc,
    updateDoc,
    deleteDoc,
    serverTimestamp,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const EVENT_ID = "suzini-summer-tour-2026";

  const params = new URLSearchParams(window.location.search);
  const STEP_ID = params.get("step") || "etape-1";
  document.body.dataset.step = STEP_ID;

  const isAmericano = STEP_ID === "etape-1";
  const collectionName = isAmericano ? "players" : "teams";

  const stepNames = {
    "etape-1":"Étape 1 — Americano",
    "etape-2":"Étape 2 — Double mixte",
    "etape-3":"Étape 3 — Double mixte"
  };

  const loginSection = document.getElementById("loginSection");
  const adminSection = document.getElementById("adminSection");
  const statsSection = document.getElementById("statsSection");
  const itemsSection = document.getElementById("itemsSection");

  const loginForm = document.getElementById("loginForm");
  const loginMessage = document.getElementById("loginMessage");

  const stepLabel = document.getElementById("stepLabel");
  const currentState = document.getElementById("currentState");
  const statusMessage = document.getElementById("statusMessage");
  const pageSubtitle = document.getElementById("pageSubtitle");

  const btnNotOpen = document.getElementById("btnNotOpen");
  const btnOpen = document.getElementById("btnOpen");
  const btnPause = document.getElementById("btnPause");
  const btnClose = document.getElementById("btnClose");

  const itemsList = document.getElementById("itemsList");
  const listTitle = document.getElementById("listTitle");
  const listText = document.getElementById("listText");

  const countTotal = document.getElementById("countTotal");
  const countRegistered = document.getElementById("countRegistered");
  const countConfirmed = document.getElementById("countConfirmed");

  const stepRef = doc(db, "events", EVENT_ID, "steps", STEP_ID);
  const itemsRef = collection(db, "events", EVENT_ID, "steps", STEP_ID, collectionName);

  let unsubscribeStep = null;
  let unsubscribeItems = null;
  let currentStatus = "not_open";

  stepLabel.textContent = stepNames[STEP_ID] || STEP_ID;
  listTitle.textContent = isAmericano ? "Joueurs inscrits" : "Équipes inscrites";
  listText.textContent = isAmericano
    ? "Liste des joueurs de l’Americano."
    : "Liste des équipes de double mixte.";

  pageSubtitle.textContent = isAmericano
    ? "Ouverture, suspension, clôture et suivi des joueurs."
    : "Ouverture, suspension, clôture et suivi des équipes.";

  function esc(value){
    return String(value || "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function stateLabel(state){
    switch(state){
      case "open": return "✅ Ouvertes";
      case "paused": return "⏸️ Suspendues";
      case "closed": return "🔒 Clôturées";
      default: return "💤 Pas encore ouvertes";
    }
  }

  function showAdmin(){
    loginSection.style.display = "none";
    adminSection.style.display = "block";
    statsSection.style.display = "block";
    itemsSection.style.display = "block";
  }

  function hideAdmin(){
    loginSection.style.display = "block";
    adminSection.style.display = "none";
    statsSection.style.display = "none";
    itemsSection.style.display = "none";
  }

  async function isAdmin(uid){
    const userRef = doc(db, "users", uid);
    const snap = await getDoc(userRef);

    if(!snap.exists()) return false;

    const data = snap.data() || {};
    return data.role === "admin" && data.active === true;
  }

  function setButtonsDisabled(disabled){
    [btnNotOpen, btnOpen, btnPause, btnClose].forEach(btn => {
      btn.disabled = disabled;
    });
  }

  async function setState(nextState){
    setButtonsDisabled(true);
    statusMessage.textContent = "Mise à jour du statut…";

    try{
      await setDoc(stepRef, {
        inscriptionsState:nextState,
        updatedAt:serverTimestamp(),
        updatedBy:auth.currentUser?.uid || null
      }, { merge:true });

      statusMessage.textContent = "✅ Statut mis à jour.";
    }catch(error){
      console.error(error);
      statusMessage.textContent = "❌ Impossible de modifier le statut.";
    }finally{
      setButtonsDisabled(false);
    }
  }

  function startStepListener(){
    if(unsubscribeStep) unsubscribeStep();

    unsubscribeStep = onSnapshot(stepRef, (snap) => {
      const data = snap.exists() ? snap.data() : {};
      currentStatus = data.inscriptionsState || "not_open";

      currentState.textContent = stateLabel(currentStatus);
      btnPause.textContent = currentStatus === "paused" ? "▶️ Réouvrir" : "⏸️ Suspendre";
    });
  }

  function playerCard(id, data){
    const prenom = data.prenom || "";
    const nom = data.nom || "";
    const surnom = data.surnom || "—";
    const status = data.status || "registered";

    return `
      <div class="item-card">
        <div class="item-title">${esc(surnom)}</div>
        <div class="item-meta">
          ${esc(prenom)} ${esc(nom)}<br>
          Statut : <strong>${esc(status)}</strong>
        </div>
        <div class="item-actions">
          <button class="mini-btn green" data-action="confirm" data-id="${esc(id)}">Confirmer</button>
          <button class="mini-btn yellow" data-action="registered" data-id="${esc(id)}">Remettre inscrit</button>
          <button class="mini-btn red" data-action="delete" data-id="${esc(id)}" data-key="${esc(data.nicknameKey || "")}">Supprimer</button>
        </div>
      </div>
    `;
  }

  function teamCard(id, data){
    const woman = data.woman || data.player1 || {};
    const man = data.man || data.player2 || {};
    const status = data.status || "registered";
    const teamName = data.teamName || `${woman.prenom || ""} & ${man.prenom || ""}`;

    return `
      <div class="item-card">
        <div class="item-title">${esc(teamName || "Équipe")}</div>
        <div class="item-meta">
          <strong>Joueuse :</strong> ${esc(woman.prenom)} ${esc(woman.nom)} — Licence ${esc(woman.licence)}<br>
          <strong>Joueur :</strong> ${esc(man.prenom)} ${esc(man.nom)} — Licence ${esc(man.licence)}<br>
          Statut : <strong>${esc(status)}</strong>
        </div>
        <div class="item-actions">
          <button class="mini-btn green" data-action="confirm" data-id="${esc(id)}">Confirmer</button>
          <button class="mini-btn yellow" data-action="registered" data-id="${esc(id)}">Remettre inscrit</button>
          <button class="mini-btn red" data-action="delete" data-id="${esc(id)}">Supprimer</button>
        </div>
      </div>
    `;
  }

  function startItemsListener(){
    if(unsubscribeItems) unsubscribeItems();

    const q = query(itemsRef, orderBy("createdAt", "asc"));

    unsubscribeItems = onSnapshot(q, (snap) => {
      let total = 0;
      let registered = 0;
      let confirmed = 0;

      if(snap.empty){
        itemsList.innerHTML = `<div class="admin-status">Aucune inscription pour le moment.</div>`;
      }else{
        itemsList.innerHTML = "";
      }

      snap.forEach(docSnap => {
        const data = docSnap.data() || {};
        total++;

        if(data.status === "confirmed") confirmed++;
        else registered++;

        itemsList.insertAdjacentHTML(
          "beforeend",
          isAmericano
            ? playerCard(docSnap.id, data)
            : teamCard(docSnap.id, data)
        );
      });

      countTotal.textContent = total;
      countRegistered.textContent = registered;
      countConfirmed.textContent = confirmed;
    });
  }

  itemsList.addEventListener("click", async (event) => {
    const btn = event.target.closest("button");
    if(!btn) return;

    const action = btn.dataset.action;
    const id = btn.dataset.id;
    const nicknameKey = btn.dataset.key;

    if(!id) return;

    const itemRef = doc(db, "events", EVENT_ID, "steps", STEP_ID, collectionName, id);

    try{
      if(action === "confirm"){
        await updateDoc(itemRef, {
          status:"confirmed",
          updatedAt:serverTimestamp()
        });
      }

      if(action === "registered"){
        await updateDoc(itemRef, {
          status:"registered",
          updatedAt:serverTimestamp()
        });
      }

      if(action === "delete"){
        const ok = confirm("Supprimer cette inscription ?");
        if(!ok) return;

        await deleteDoc(itemRef);

        if(isAmericano && nicknameKey){
          await deleteDoc(doc(db, "summerTourNicknames", nicknameKey));
        }
      }
    }catch(error){
      console.error(error);
      alert("Erreur : action impossible.");
    }
  });

  function stopListeners(){
    if(unsubscribeStep) unsubscribeStep();
    if(unsubscribeItems) unsubscribeItems();

    unsubscribeStep = null;
    unsubscribeItems = null;
  }

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    loginMessage.textContent = "Connexion…";

    try{
      await signInWithEmailAndPassword(
        auth,
        loginForm.email.value.trim(),
        loginForm.password.value
      );

      loginMessage.textContent = "Connecté.";
    }catch(error){
      console.error(error);
      loginMessage.textContent = "Connexion impossible.";
    }
  });

  btnNotOpen.onclick = () => setState("not_open");
  btnOpen.onclick = () => setState("open");
  btnPause.onclick = () => setState(currentStatus === "paused" ? "open" : "paused");
  btnClose.onclick = () => setState("closed");

  onAuthStateChanged(auth, async (user) => {
    stopListeners();

    if(!user){
      hideAdmin();
      return;
    }

    try{
      const ok = await isAdmin(user.uid);

      if(!ok){
        hideAdmin();
        loginMessage.textContent = "Connecté, mais accès admin refusé.";
        return;
      }

      showAdmin();
      startStepListener();
      startItemsListener();

    }catch(error){
      console.error(error);
      hideAdmin();
      loginMessage.textContent = "Erreur de vérification admin.";
    }
  });
</script>

</body>
</html>
