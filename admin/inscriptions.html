<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Inscriptions Summer Tour</title>

  <link rel="stylesheet" href="../assets/css/style.css" />

  <style>
    main{padding-top:0;padding-bottom:24px;}
    .section{margin-top:10px;}
    .section:first-child{margin-top:0;}
    .compact-panel{padding:12px;border-radius:22px;}

    .admin-form,.items-list{display:grid;gap:10px;}

    .admin-input{
      width:100%;
      min-height:48px;
      border:0;
      border-radius:16px;
      padding:12px 14px;
      font-size:16px;
      font-weight:800;
      background:#fff;
      color:#102033;
    }

    .admin-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:10px;
    }

    .admin-btn,.mini-btn{
      border:0;
      font-weight:1000;
      cursor:pointer;
      font-family:inherit;
    }

    .admin-btn{
      min-height:42px;
      border-radius:14px;
      padding:9px 11px;
      font-size:13px;
      background:#063b72;
      color:#fff;
    }

    .admin-btn.pink,.mini-btn.pink{background:#ff3e8a;color:#fff;}
    .admin-btn.yellow,.mini-btn.yellow{background:#ffd84d;color:#102033;}
    .admin-btn.green,.mini-btn.green{background:#0b7a3b;color:#fff;}
    .admin-btn.red,.mini-btn.red{background:#9b1c1c;color:#fff;}
    .admin-btn:disabled,.mini-btn:disabled{opacity:.55;cursor:not-allowed;}

    .admin-status{
      padding:10px 12px;
      border-radius:16px;
      background:#fff;
      color:#102033;
      font-size:13px;
      font-weight:900;
      line-height:1.35;
      box-shadow:0 6px 14px rgba(16,24,40,.08);
    }

    .stats-line{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }

    .stat-box{
      background:#fff;
      color:#063b72;
      border-radius:16px;
      padding:10px;
      text-align:center;
      font-weight:1000;
    }

    .stat-box strong{
      display:block;
      font-size:24px;
      line-height:1;
    }

    .stat-box span{
      display:block;
      margin-top:4px;
      font-size:10px;
      text-transform:uppercase;
      color:#667085;
    }

    .item-card{
      background:#fff;
      color:#102033;
      border-radius:18px;
      padding:12px;
      display:grid;
      gap:8px;
      box-shadow:0 8px 18px rgba(16,24,40,.10);
    }

    .item-title{
      font-size:19px;
      font-weight:1000;
      color:#063b72;
      line-height:1.05;
    }

    .item-meta{
      font-size:13px;
      font-weight:850;
      color:#344054;
      line-height:1.35;
    }

    .item-actions{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .mini-btn{
      border-radius:999px;
      padding:8px 12px;
      font-size:12px;
      background:#063b72;
      color:#fff;
    }

    .subtabs{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:8px;
      margin-bottom:10px;
    }

    .subtab{
      min-height:40px;
      border:0;
      border-radius:14px;
      background:#063b72;
      color:#fff;
      font-size:12px;
      font-weight:1000;
      cursor:pointer;
    }

    .subtab.active{
      background:#ffd84d;
      color:#102033;
    }

    .hidden{display:none!important;}

    @media(min-width:760px){
      .admin-actions{grid-template-columns:repeat(4,1fr);}
      .items-list{grid-template-columns:1fr 1fr;}
    }
  </style>
</head>

<body data-page="inscriptions" data-step="etape-1">

<div id="adminHeader"></div>

<main class="container">

  <section class="section" id="loginSection">
    <div class="summer-panel compact-panel">
      <div class="summer-panel-head">
        <div>
          <h1 class="summer-panel-title">Connexion admin</h1>
          <p class="summer-panel-text">Connecte-toi pour gérer les inscriptions.</p>
        </div>
        <div class="summer-pill">Admin</div>
      </div>

      <form id="loginForm" class="admin-form">
        <input id="email" class="admin-input" type="email" placeholder="Email" required>
        <input id="password" class="admin-input" type="password" placeholder="Mot de passe" required>

        <button class="admin-btn" type="submit">🔐 Se connecter</button>

        <div id="loginMessage" class="admin-status">Non connecté.</div>
      </form>
    </div>
  </section>

  <section class="section" id="adminSection" style="display:none;">
    <div class="summer-panel compact-panel">
      <div class="summer-panel-head">
        <div>
          <h1 class="summer-panel-title">Gestion inscriptions</h1>
          <p class="summer-panel-text" id="pageSubtitle">Ouverture, suspension, clôture et suivi.</p>
        </div>
        <div class="summer-pill" id="stepLabel">Étape</div>
      </div>

      <div class="admin-status">
        <strong>Statut actuel :</strong>
        <span id="currentState">Chargement…</span>
      </div>

      <div class="admin-actions">
        <button class="admin-btn yellow" id="btnNotOpen" type="button">💤 Pas ouvertes</button>
        <button class="admin-btn green" id="btnOpen" type="button">✅ Ouvrir</button>
        <button class="admin-btn pink" id="btnPause" type="button">⏸️ Suspendre</button>
        <button class="admin-btn" id="btnClose" type="button">🔒 Clôturer</button>
      </div>

      <div id="statusMessage" class="admin-status" style="margin-top:10px;">—</div>
    </div>
  </section>

  <section class="section" id="statsSection" style="display:none;">
    <div class="summer-panel compact-panel">
      <div class="stats-line">
        <div class="stat-box">
          <strong id="countTotal">0</strong>
          <span>Total</span>
        </div>

        <div class="stat-box">
          <strong id="countRegistered">0</strong>
          <span>Inscrits</span>
        </div>

        <div class="stat-box">
          <strong id="countConfirmed">0</strong>
          <span>Confirmés</span>
        </div>
      </div>
    </div>
  </section>

  <section class="section" id="itemsSection" style="display:none;">
    <div class="summer-panel compact-panel">

      <div id="etape2Tabs" class="subtabs hidden">
        <button class="subtab active" id="tabTeams" type="button">👥 Équipes</button>
        <button class="subtab" id="tabProfiles" type="button">🔎 Recherches</button>
        <button class="subtab" id="tabInvites" type="button">🤝 Propositions</button>
      </div>

      <div class="summer-panel-head">
        <div>
          <h2 class="summer-panel-title" id="listTitle">Inscriptions</h2>
          <p class="summer-panel-text" id="listText">Liste des inscriptions.</p>
        </div>
        <div class="summer-pill">Live</div>
      </div>

      <div id="itemsList" class="items-list">
        <div class="admin-status">Chargement…</div>
      </div>
    </div>
  </section>

</main>

<script type="module" src="../assets/js/header-admin.js"></script>

<script type="module">
  import { auth, db } from "../assets/js/firebase.js?v=admin-inscriptions-summer-v3";

  import {
    signInWithEmailAndPassword,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

  import {
    collection,
    doc,
    getDoc,
    onSnapshot,
    setDoc,
    updateDoc,
    deleteDoc,
    serverTimestamp,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const EVENT_ID = "suzini-summer-tour-2026";

  const params = new URLSearchParams(window.location.search);
  const STEP_ID = params.get("step") || "etape-1";
  document.body.dataset.step = STEP_ID;

  const isAmericano = STEP_ID === "etape-1";

  const stepNames = {
    "etape-1":"Étape 1 — Americano",
    "etape-2":"Étape 2 — Double mixte",
    "etape-3":"Étape 3 — Double mixte"
  };

  const loginSection = document.getElementById("loginSection");
  const adminSection = document.getElementById("adminSection");
  const statsSection = document.getElementById("statsSection");
  const itemsSection = document.getElementById("itemsSection");

  const loginForm = document.getElementById("loginForm");
  const loginMessage = document.getElementById("loginMessage");

  const stepLabel = document.getElementById("stepLabel");
  const currentState = document.getElementById("currentState");
  const statusMessage = document.getElementById("statusMessage");
  const pageSubtitle = document.getElementById("pageSubtitle");

  const btnNotOpen = document.getElementById("btnNotOpen");
  const btnOpen = document.getElementById("btnOpen");
  const btnPause = document.getElementById("btnPause");
  const btnClose = document.getElementById("btnClose");

  const etape2Tabs = document.getElementById("etape2Tabs");
  const tabTeams = document.getElementById("tabTeams");
  const tabProfiles = document.getElementById("tabProfiles");
  const tabInvites = document.getElementById("tabInvites");

  const itemsList = document.getElementById("itemsList");
  const listTitle = document.getElementById("listTitle");
  const listText = document.getElementById("listText");

  const countTotal = document.getElementById("countTotal");
  const countRegistered = document.getElementById("countRegistered");
  const countConfirmed = document.getElementById("countConfirmed");

  const stepRef = doc(db, "events", EVENT_ID, "steps", STEP_ID);

  const playersRef = collection(db, "events", EVENT_ID, "steps", STEP_ID, "players");
  const teamsRef = collection(db, "events", EVENT_ID, "steps", STEP_ID, "teams");
  const profilesRef = collection(db, "events", EVENT_ID, "steps", STEP_ID, "partnerProfiles");
  const invitesRef = collection(db, "events", EVENT_ID, "steps", STEP_ID, "teamInvitations");

  let unsubscribeStep = null;
  let unsubscribeMain = null;
  let currentStatus = "not_open";
  let currentTab = "teams";
  let liveRows = [];

  stepLabel.textContent = stepNames[STEP_ID] || STEP_ID;

  function esc(value){
    return String(value || "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function clean(value){
    return String(value || "").trim();
  }

  function stateLabel(state){
    switch(state){
      case "open": return "✅ Ouvertes";
      case "paused": return "⏸️ Suspendues";
      case "closed": return "🔒 Clôturées";
      default: return "💤 Pas encore ouvertes";
    }
  }

  function showAdmin(){
    loginSection.style.display = "none";
    adminSection.style.display = "block";
    statsSection.style.display = "block";
    itemsSection.style.display = "block";
  }

  function hideAdmin(){
    loginSection.style.display = "block";
    adminSection.style.display = "none";
    statsSection.style.display = "none";
    itemsSection.style.display = "none";
  }

  async function isAdmin(uid){
    const snap = await getDoc(doc(db, "users", uid));
    if(!snap.exists()) return false;

    const data = snap.data() || {};
    return data.role === "admin" && data.active === true;
  }

  function setButtonsDisabled(disabled){
    [btnNotOpen, btnOpen, btnPause, btnClose].forEach(btn => {
      btn.disabled = disabled;
    });
  }

  async function setState(nextState){
    setButtonsDisabled(true);
    statusMessage.textContent = "Mise à jour du statut…";

    try{
      await setDoc(stepRef, {
        inscriptionsState:nextState,
        updatedAt:serverTimestamp(),
        updatedBy:auth.currentUser?.uid || null
      }, { merge:true });

      statusMessage.textContent = "✅ Statut mis à jour.";
    }catch(error){
      console.error(error);
      statusMessage.textContent = "❌ Impossible de modifier le statut.";
    }finally{
      setButtonsDisabled(false);
    }
  }

  function startStepListener(){
    if(unsubscribeStep) unsubscribeStep();

    unsubscribeStep = onSnapshot(stepRef, (snap) => {
      const data = snap.exists() ? snap.data() : {};
      currentStatus = data.inscriptionsState || "not_open";

      currentState.textContent = stateLabel(currentStatus);
      btnPause.textContent = currentStatus === "paused" ? "▶️ Réouvrir" : "⏸️ Suspendre";
    });
  }

  function setEtape2Tab(tab){
    currentTab = tab;

    tabTeams.classList.toggle("active", tab === "teams");
    tabProfiles.classList.toggle("active", tab === "profiles");
    tabInvites.classList.toggle("active", tab === "invites");

    startMainListener();
  }

  function updateTitles(){
    etape2Tabs.classList.toggle("hidden", isAmericano);

    if(isAmericano){
      listTitle.textContent = "Joueurs inscrits";
      listText.textContent = "Liste des joueurs de l’Americano.";
      pageSubtitle.textContent = "Ouverture, suspension, clôture et suivi des joueurs.";
      return;
    }

    pageSubtitle.textContent = "Ouverture, suspension, clôture et suivi des équipes.";

    if(currentTab === "profiles"){
      listTitle.textContent = "Recherches partenaire";
      listText.textContent = "Profils déposés par les joueurs en recherche.";
      return;
    }

    if(currentTab === "invites"){
      listTitle.textContent = "Propositions d’équipe";
      listText.textContent = "Propositions envoyées depuis les profils.";
      return;
    }

    listTitle.textContent = "Équipes inscrites";
    listText.textContent = "Liste des équipes de double mixte.";
  }

  function countRows(rows){
    let total = rows.length;
    let registered = 0;
    let confirmed = 0;

    rows.forEach(row => {
      if(row.status === "confirmed" || row.status === "accepted") confirmed++;
      else registered++;
    });

    countTotal.textContent = total;
    countRegistered.textContent = registered;
    countConfirmed.textContent = confirmed;
  }

  function playerCard(id, data){
    const prenom = data.prenom || "";
    const nom = data.nom || "";
    const surnom = data.surnom || "—";
    const status = data.status || "registered";

    return `
      <div class="item-card">
        <div class="item-title">${esc(surnom)}</div>
        <div class="item-meta">
          ${esc(prenom)} ${esc(nom)}<br>
          Statut : <strong>${esc(status)}</strong>
        </div>
        <div class="item-actions">
          <button class="mini-btn green" data-action="confirm" data-id="${esc(id)}">Confirmer</button>
          <button class="mini-btn yellow" data-action="registered" data-id="${esc(id)}">Remettre inscrit</button>
          <button class="mini-btn red" data-action="delete-player" data-id="${esc(id)}" data-key="${esc(data.nicknameKey || "")}">Supprimer</button>
        </div>
      </div>
    `;
  }

  function teamCard(id, data){
    const woman = data.woman || data.player1 || {};
    const man = data.man || data.player2 || {};
    const status = data.status || "registered";
    const teamName = data.teamName || `${woman.prenom || ""} & ${man.prenom || ""}`;

    return `
      <div class="item-card">
        <div class="item-title">${esc(teamName || "Équipe")}</div>
        <div class="item-meta">
          <strong>Joueuse :</strong> ${esc(woman.prenom)} ${esc(woman.nom)} — Licence ${esc(woman.licence)}<br>
          <strong>Joueur :</strong> ${esc(man.prenom)} ${esc(man.nom)} — Licence ${esc(man.licence)}<br>
          Statut : <strong>${esc(status)}</strong><br>
          Source : ${esc(data.source || "—")}
        </div>
        <div class="item-actions">
          <button class="mini-btn green" data-action="confirm" data-id="${esc(id)}">Confirmer</button>
          <button class="mini-btn yellow" data-action="registered" data-id="${esc(id)}">Remettre inscrit</button>
          <button class="mini-btn red" data-action="delete-team" data-id="${esc(id)}">Supprimer</button>
        </div>
      </div>
    `;
  }

  function profileCard(id, data){
    const status = data.status || "active";
    const sex = data.sexe === "F" ? "Joueuse" : "Joueur";

    return `
      <div class="item-card">
        <div class="item-title">${esc(data.prenom || "Profil")} — ${esc(sex)}</div>
        <div class="item-meta">
          <strong>Nom :</strong> ${esc(data.nom)}<br>
          <strong>Licence :</strong> ${esc(data.licence)}<br>
          <strong>Téléphone :</strong> ${esc(data.phone)}<br>
          <strong>Statut :</strong> ${esc(status)}<br><br>
          ${esc(data.profile)}
        </div>
        <div class="item-actions">
          <button class="mini-btn green" data-action="profile-active" data-id="${esc(id)}">Actif</button>
          <button class="mini-btn yellow" data-action="profile-closed" data-id="${esc(id)}">Masquer</button>
          <button class="mini-btn red" data-action="delete-profile" data-id="${esc(id)}">Supprimer</button>
        </div>
      </div>
    `;
  }

  function inviteCard(id, data){
    const proposer = data.proposer || {};
    const status = data.status || "pending";

    return `
      <div class="item-card">
        <div class="item-title">Proposition pour ${esc(data.partnerPrenom || "profil")}</div>
        <div class="item-meta">
          <strong>Proposé par :</strong> ${esc(proposer.prenom)} ${esc(proposer.nom)}<br>
          <strong>Licence :</strong> ${esc(proposer.licence)}<br>
          <strong>Statut :</strong> ${esc(status)}
        </div>
        <div class="item-actions">
          <button class="mini-btn yellow" data-action="invite-pending" data-id="${esc(id)}">Remettre attente</button>
          <button class="mini-btn green" data-action="invite-accepted" data-id="${esc(id)}">Marquer acceptée</button>
          <button class="mini-btn pink" data-action="invite-refused" data-id="${esc(id)}">Marquer refusée</button>
          <button class="mini-btn red" data-action="delete-invite" data-id="${esc(id)}">Supprimer</button>
        </div>
      </div>
    `;
  }

  function renderRows(rows){
    liveRows = rows;
    countRows(rows);

    if(!rows.length){
      itemsList.innerHTML = `<div class="admin-status">Aucun élément pour le moment.</div>`;
      return;
    }

    if(isAmericano){
      itemsList.innerHTML = rows.map(r => playerCard(r.id, r)).join("");
      return;
    }

    if(currentTab === "profiles"){
      itemsList.innerHTML = rows.map(r => profileCard(r.id, r)).join("");
      return;
    }

    if(currentTab === "invites"){
      itemsList.innerHTML = rows.map(r => inviteCard(r.id, r)).join("");
      return;
    }

    itemsList.innerHTML = rows.map(r => teamCard(r.id, r)).join("");
  }

  function mainCollection(){
    if(isAmericano) return playersRef;
    if(currentTab === "profiles") return profilesRef;
    if(currentTab === "invites") return invitesRef;
    return teamsRef;
  }

  function startMainListener(){
    if(unsubscribeMain) unsubscribeMain();

    updateTitles();
    itemsList.innerHTML = `<div class="admin-status">Chargement…</div>`;

    unsubscribeMain = onSnapshot(
      query(mainCollection(), orderBy("createdAt", "asc")),
      (snap) => {
        const rows = snap.docs.map(d => ({
          id:d.id,
          ...d.data()
        }));

        renderRows(rows);
      },
      (error) => {
        console.error(error);
        itemsList.innerHTML = `<div class="admin-status">Erreur de chargement.</div>`;
      }
    );
  }

  async function updateItem(id, patch){
    let ref;

    if(isAmericano) ref = doc(db, "events", EVENT_ID, "steps", STEP_ID, "players", id);
    else if(currentTab === "profiles") ref = doc(db, "events", EVENT_ID, "steps", STEP_ID, "partnerProfiles", id);
    else if(currentTab === "invites") ref = doc(db, "events", EVENT_ID, "steps", STEP_ID, "teamInvitations", id);
    else ref = doc(db, "events", EVENT_ID, "steps", STEP_ID, "teams", id);

    await updateDoc(ref, {
      ...patch,
      updatedAt:serverTimestamp()
    });
  }

  async function deleteItem(id, type, nicknameKey = ""){
    const ok = confirm("Supprimer cet élément ?");
    if(!ok) return;

    if(type === "player"){
      await deleteDoc(doc(db, "events", EVENT_ID, "steps", STEP_ID, "players", id));
      if(nicknameKey){
        await deleteDoc(doc(db, "summerTourNicknames", nicknameKey));
      }
      return;
    }

    if(type === "team"){
      await deleteDoc(doc(db, "events", EVENT_ID, "steps", STEP_ID, "teams", id));
      return;
    }

    if(type === "profile"){
      await deleteDoc(doc(db, "events", EVENT_ID, "steps", STEP_ID, "partnerProfiles", id));
      return;
    }

    if(type === "invite"){
      await deleteDoc(doc(db, "events", EVENT_ID, "steps", STEP_ID, "teamInvitations", id));
    }
  }

  itemsList.addEventListener("click", async (event) => {
    const btn = event.target.closest("button[data-action]");
    if(!btn) return;

    const action = btn.dataset.action;
    const id = btn.dataset.id;

    btn.disabled = true;

    try{
      if(action === "confirm") await updateItem(id, { status:"confirmed" });
      if(action === "registered") await updateItem(id, { status:"registered" });

      if(action === "profile-active") await updateItem(id, { status:"active", closedReason:null });
      if(action === "profile-closed") await updateItem(id, { status:"closed", closedReason:"admin" });

      if(action === "invite-pending") await updateItem(id, { status:"pending" });
      if(action === "invite-accepted") await updateItem(id, { status:"accepted" });
      if(action === "invite-refused") await updateItem(id, { status:"refused" });

      if(action === "delete-player") await deleteItem(id, "player", btn.dataset.key || "");
      if(action === "delete-team") await deleteItem(id, "team");
      if(action === "delete-profile") await deleteItem(id, "profile");
      if(action === "delete-invite") await deleteItem(id, "invite");

    }catch(error){
      console.error(error);
      alert("Action impossible.");
    }finally{
      btn.disabled = false;
    }
  });

  function stopListeners(){
    if(unsubscribeStep) unsubscribeStep();
    if(unsubscribeMain) unsubscribeMain();

    unsubscribeStep = null;
    unsubscribeMain = null;
  }

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    loginMessage.textContent = "Connexion…";

    try{
      await signInWithEmailAndPassword(
        auth,
        loginForm.email.value.trim(),
        loginForm.password.value
      );

      loginMessage.textContent = "Connecté.";
    }catch(error){
      console.error(error);
      loginMessage.textContent = "Connexion impossible.";
    }
  });

  btnNotOpen.onclick = () => setState("not_open");
  btnOpen.onclick = () => setState("open");
  btnPause.onclick = () => setState(currentStatus === "paused" ? "open" : "paused");
  btnClose.onclick = () => setState("closed");

  if(tabTeams) tabTeams.onclick = () => setEtape2Tab("teams");
  if(tabProfiles) tabProfiles.onclick = () => setEtape2Tab("profiles");
  if(tabInvites) tabInvites.onclick = () => setEtape2Tab("invites");

  onAuthStateChanged(auth, async (user) => {
    stopListeners();

    if(!user){
      hideAdmin();
      return;
    }

    try{
      const ok = await isAdmin(user.uid);

      if(!ok){
        hideAdmin();
        loginMessage.textContent = "Connecté, mais accès admin refusé.";
        return;
      }

      showAdmin();
      startStepListener();
      startMainListener();

    }catch(error){
      console.error(error);
      hideAdmin();
      loginMessage.textContent = "Erreur de vérification admin.";
    }
  });
</script>

</body>
</html>
