<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Activation compte — Suzini BT Summer Tour</title>

  <link rel="stylesheet" href="assets/css/style.css" />

  <style>
    body{min-height:100vh;}
    main{
      min-height:100vh;
      padding-top:calc(var(--public-total-top, 150px) + 24px);
      padding-bottom:38px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .activation-card{
      width:min(520px,100%);
      background:rgba(255,255,255,.96);
      border-radius:28px;
      box-shadow:0 16px 40px rgba(16,24,40,.14);
      padding:22px;
      display:grid;
      gap:14px;
    }

    .activation-head{text-align:center;}
    .activation-title{
      margin:0;
      font-size:32px;
      line-height:1;
      letter-spacing:-.04em;
      font-weight:1000;
      color:#063b72;
    }

    .activation-sub{
      margin:8px 0 0;
      color:#667085;
      font-size:15px;
      line-height:1.4;
      font-weight:800;
    }

    .field{display:grid;gap:8px;}
    .field label{font-weight:1000;color:#102033;}

    input{
      width:100%;
      min-height:54px;
      border-radius:18px;
      border:1px solid rgba(16,24,40,.12);
      background:#fff;
      padding:0 15px;
      font-size:16px;
      color:#17212b;
      outline:none;
      font-family:inherit;
      font-weight:800;
    }

    .password-wrap{position:relative;}
    .password-wrap input{padding-right:58px;}

    .eye-btn{
      position:absolute;
      right:8px;
      top:50%;
      transform:translateY(-50%);
      width:42px;
      height:42px;
      border:0;
      border-radius:999px;
      background:#fff4d4;
      color:#063b72;
      font-size:20px;
      cursor:pointer;
    }

    .btn{
      border:0;
      min-height:56px;
      border-radius:18px;
      padding:14px 18px;
      font-size:16px;
      font-weight:1000;
      cursor:pointer;
      background:linear-gradient(180deg,#ffd84d,#f3b800);
      color:#102033;
      box-shadow:0 12px 22px rgba(255,210,31,.22);
    }

    .btn:disabled{opacity:.55;cursor:not-allowed;}

    .status{
      min-height:22px;
      text-align:center;
      color:#667085;
      font-size:14px;
      font-weight:900;
      line-height:1.4;
    }

    .status.ok{color:#087a35;}
    .status.err{color:#a32323;}
  </style>
</head>

<body>

<div id="siteHeader"></div>

<main class="container">
  <div class="activation-card">

    <div class="activation-head">
      <h1 class="activation-title">🔐 Activation compte</h1>
      <p class="activation-sub">
        Renseigne ton email et choisis ton mot de passe pour activer ton accès admin Summer Tour.
      </p>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="ton.email@exemple.com" autocomplete="email" required>
    </div>

    <div class="field">
      <label for="password">Mot de passe</label>
      <div class="password-wrap">
        <input id="password" type="password" placeholder="Minimum 6 caractères" autocomplete="new-password" required>
        <button class="eye-btn" id="togglePassword" type="button">👁️</button>
      </div>
    </div>

    <button class="btn" id="btnCreate">Créer mon compte</button>

    <div class="status" id="status"></div>
  </div>
</main>

<script type="module" src="assets/js/header-gen.js"></script>

<script type="module">
  import { auth, db } from "./assets/js/firebase.js?v=summer-join-1";

  import {
    createUserWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

  import {
    doc,
    getDoc,
    setDoc,
    updateDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const EVENT_ID = "suzini-summer-tour-2026";
  const INVITE_CODE = "SUMMER2026";

  const statusEl = document.getElementById("status");
  const btn = document.getElementById("btnCreate");
  const emailEl = document.getElementById("email");
  const passwordEl = document.getElementById("password");
  const togglePassword = document.getElementById("togglePassword");

  const params = new URLSearchParams(window.location.search);
  const inviteId = params.get("invite");

  function setStatus(message, type = ""){
    statusEl.textContent = message;
    statusEl.className = "status";
    if(type) statusEl.classList.add(type);
  }

  togglePassword.onclick = () => {
    const visible = passwordEl.type === "text";
    passwordEl.type = visible ? "password" : "text";
    togglePassword.textContent = visible ? "👁️" : "🙈";
  };

  if(!inviteId){
    setStatus("❌ Lien d’invitation invalide.", "err");
    btn.disabled = true;
  }

  btn.onclick = async () => {
    const email = emailEl.value.trim();
    const password = passwordEl.value;

    if(!email || !password){
      setStatus("❌ Email et mot de passe requis.", "err");
      return;
    }

    if(password.length < 6){
      setStatus("❌ Le mot de passe doit contenir au moins 6 caractères.", "err");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Activation en cours…";
    setStatus("Vérification de l’invitation…");

    try{
      const inviteRef = doc(db, "invites", inviteId);
      const inviteSnap = await getDoc(inviteRef);

      if(!inviteSnap.exists()){
        throw new Error("Invitation introuvable ou expirée.");
      }

      const invite = inviteSnap.data() || {};

      if(invite.eventId !== EVENT_ID){
        throw new Error("Invitation non valide pour ce site.");
      }

      if(invite.status && invite.status !== "pending"){
        throw new Error("Cette invitation a déjà été utilisée.");
      }

      if(invite.code !== INVITE_CODE){
        throw new Error("Code invitation invalide.");
      }

      if(invite.role !== "admin"){
        throw new Error("Cette invitation n’est pas une invitation admin.");
      }

      setStatus("Création du compte…");

      const cred = await createUserWithEmailAndPassword(auth, email, password);
      const user = cred.user;

      setStatus("Attribution du rôle admin…");

      await setDoc(doc(db, "users", user.uid), {
        uid:user.uid,
        email,
        label:invite.label || "",
        role:"admin",
        active:true,
        eventId:EVENT_ID,
        inviteId,
        createdAt:serverTimestamp(),
        updatedAt:serverTimestamp()
      });

      await updateDoc(inviteRef, {
        status:"used",
        usedAt:serverTimestamp(),
        usedBy:user.uid,
        email
      });

      setStatus("✅ Compte activé ! Redirection…", "ok");

      setTimeout(() => {
        window.location.href = "index.html";
      }, 1200);

    }catch(error){
      console.error(error);

      let message = error?.message || "Erreur inconnue.";

      if(error?.code === "auth/email-already-in-use"){
        message = "Cet email est déjà utilisé.";
      }

      if(error?.code === "auth/invalid-email"){
        message = "Adresse email invalide.";
      }

      if(error?.code === "auth/weak-password"){
        message = "Mot de passe trop faible : minimum 6 caractères.";
      }

      setStatus("❌ " + message, "err");
      btn.disabled = false;
      btn.textContent = "Créer mon compte";
    }
  };
</script>

</body>
</html>
