<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inscription — Étape 1 Americano</title>

  <link rel="stylesheet" href="../assets/css/style.css" />

  <style>
    .form-box{display:grid;gap:12px;}
    .field{display:grid;gap:7px;}

    .field label{
      color:#fff;
      font-size:13px;
      font-weight:1000;
      text-transform:uppercase;
    }

    .field input{
      width:100%;
      min-height:48px;
      border:0;
      border-radius:16px;
      padding:12px 14px;
      font-size:16px;
      font-weight:800;
      background:#fff;
      color:#102033;
      box-shadow:0 8px 18px rgba(16,24,40,.12);
    }

    .field input:disabled{
      opacity:.6;
      background:#eef2f6;
    }

    .hint{
      font-size:13px;
      font-weight:800;
      line-height:1.35;
      color:#fff;
    }

    .nickname-box{
      padding:12px 14px;
      border-radius:16px;
      background:#ff3e8a;
      color:#fff;
      font-size:14px;
      font-weight:900;
      line-height:1.35;
    }

    .btn-submit{
      min-height:50px;
      border:0;
      border-radius:18px;
      background:#063b72;
      color:#fff;
      font-size:16px;
      font-weight:1000;
      box-shadow:0 10px 22px rgba(16,24,40,.18);
    }

    .btn-submit:disabled{
      opacity:.55;
    }

    .message{
      display:none;
      padding:12px 14px;
      border-radius:16px;
      font-size:14px;
      font-weight:900;
      line-height:1.35;
    }

    .message.ok{
      display:block;
      background:#0b7a3b;
      color:#fff;
    }

    .message.error{
      display:block;
      background:#ff3e8a;
      color:#fff;
    }
  </style>
</head>

<body
  data-page="inscription"
  data-type="americano"
  data-title="Étape 1 - Americano"
  data-date="02 juillet 2026"
>

<div id="siteHeaderEtape"></div>

<main class="container">

  <section class="section">
    <div class="hero">
      <div class="hero-inner">

        <div class="hero-pills">
          <span class="pill">Inscription</span>
          <span class="pill">Americano</span>
          <span class="pill">Ouvert à tous</span>
        </div>

        <div>
          <h1 class="hero-title">
            S’inscrire<br>
            <span class="summer">Étape 1</span>
          </h1>

          <div class="hero-slogan">
            Choisis ton surnom ou garde la proposition automatique.
          </div>
        </div>

      </div>
    </div>
  </section>

  <section class="section">
    <div class="summer-panel">
      <div class="summer-panel-head">
        <div>
          <h2 class="summer-panel-title">Formulaire joueur</h2>
          <p class="summer-panel-text">
            Le surnom doit être unique sur tout le Summer Tour.
          </p>
        </div>
        <div class="summer-pill">02/07</div>
      </div>

      <form id="signupForm" class="form-box">

        <div class="field">
          <label for="prenom">Prénom *</label>
          <input id="prenom" type="text" required autocomplete="given-name">
        </div>

        <div class="field">
          <label for="nom">Nom *</label>
          <input id="nom" type="text" required autocomplete="family-name">
        </div>

        <div class="nickname-box">
          Surnom proposé : <span id="suggestedNickname">—</span>
        </div>

        <div class="field">
          <label for="surnom">Surnom choisi</label>
          <input id="surnom" type="text" autocomplete="nickname" placeholder="Laisser vide pour garder la proposition">
          <div class="hint">
            Si tu choisis ton propre surnom, il sera refusé s’il est déjà pris.
          </div>
        </div>

        <button id="submitBtn" class="btn-submit" type="submit">
          📝 Valider mon inscription
        </button>

        <div id="formMessage" class="message"></div>

      </form>
    </div>
  </section>

</main>

<script type="module" src="../assets/js/header-etape.js"></script>

<script type="module">
  import { db } from "../assets/js/firebase.js?v=summer-inscriptions-1";

  import {
    collection,
    doc,
    getDoc,
    onSnapshot,
    runTransaction,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const EVENT_ID = "suzini-summer-tour-2026";
  const STEP_ID = "etape-1";

  const form = document.getElementById("signupForm");
  const prenomInput = document.getElementById("prenom");
  const nomInput = document.getElementById("nom");
  const surnomInput = document.getElementById("surnom");
  const suggestedNickname = document.getElementById("suggestedNickname");
  const submitBtn = document.getElementById("submitBtn");
  const message = document.getElementById("formMessage");

  const stepRef = doc(db, "events", EVENT_ID, "steps", STEP_ID);
  const playersRef = collection(db, "events", EVENT_ID, "steps", STEP_ID, "players");

  let inscriptionsState = "not_open";
  let isSubmitting = false;

  function clean(value){
    return String(value || "").trim().replace(/\s+/g, " ");
  }

  function normalizeKey(value){
    return String(value || "")
      .trim()
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }

  function makeBaseNickname(prenom, nom){
    const p = clean(prenom);
    const n = clean(nom);

    if(!p || !n) return "";

    return `${p} ${n.charAt(0).toUpperCase()}`;
  }

  async function nicknameExists(nickname){
    const key = normalizeKey(nickname);
    if(!key) return true;

    const snap = await getDoc(doc(db, "summerTourNicknames", key));
    return snap.exists();
  }

  async function findAvailableNickname(base){
    let candidate = clean(base);
    let counter = 2;

    while(await nicknameExists(candidate)){
      candidate = `${base} ${counter}`;
      counter++;
    }

    return candidate;
  }

  async function updateSuggestion(){
    const base = makeBaseNickname(prenomInput.value, nomInput.value);

    if(!base){
      suggestedNickname.textContent = "—";
      return;
    }

    suggestedNickname.textContent = "Recherche…";

    try{
      suggestedNickname.textContent = await findAvailableNickname(base);
    }catch(error){
      suggestedNickname.textContent = base;
    }
  }

  function setMessage(type, text){
    message.className = `message ${type}`;
    message.textContent = text;
  }

  function setFormEnabled(enabled){
    [...form.querySelectorAll("input")].forEach(input => input.disabled = !enabled);
    submitBtn.disabled = !enabled || isSubmitting;
  }

  function updateFormState(){
    if(inscriptionsState === "open"){
      setFormEnabled(true);
      if(!message.textContent) setMessage("", "");
      return;
    }

    setFormEnabled(false);

    if(inscriptionsState === "closed"){
      setMessage("error", "Les inscriptions sont clôturées.");
    }else if(inscriptionsState === "paused"){
      setMessage("error", "Les inscriptions sont temporairement suspendues.");
    }else{
      setMessage("error", "Les inscriptions ne sont pas encore ouvertes.");
    }
  }

  prenomInput.addEventListener("input", updateSuggestion);
  nomInput.addEventListener("input", updateSuggestion);

  onSnapshot(stepRef, (snap) => {
    const data = snap.exists() ? snap.data() : {};
    inscriptionsState = data.inscriptionsState || "not_open";
    updateFormState();
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const prenom = clean(prenomInput.value);
    const nom = clean(nomInput.value);
    const customNickname = clean(surnomInput.value);

    if(!prenom || !nom){
      setMessage("error", "Nom et prénom sont obligatoires.");
      return;
    }

    if(inscriptionsState !== "open"){
      updateFormState();
      return;
    }

    isSubmitting = true;
    submitBtn.disabled = true;
    setMessage("", "");

    try{
      const baseNickname = makeBaseNickname(prenom, nom);
      const finalNickname = customNickname || await findAvailableNickname(baseNickname);
      const nicknameKey = normalizeKey(finalNickname);

      if(!nicknameKey){
        throw new Error("Le surnom n’est pas valide.");
      }

      if(customNickname && await nicknameExists(finalNickname)){
        throw new Error("Ce surnom est déjà pris. Choisis-en un autre.");
      }

      const nicknameRef = doc(db, "summerTourNicknames", nicknameKey);
      const playerRef = doc(playersRef);

      await runTransaction(db, async (transaction) => {
        const nicknameSnap = await transaction.get(nicknameRef);

        if(nicknameSnap.exists()){
          throw new Error("Ce surnom vient d’être pris. Choisis-en un autre.");
        }

        transaction.set(playerRef, {
          eventId: EVENT_ID,
          stepId: STEP_ID,
          prenom,
          nom,
          surnom: finalNickname,
          nicknameKey,
          status: "registered",
          type: "americano",
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp(),
          source: "public-form"
        });

        transaction.set(nicknameRef, {
          nickname: finalNickname,
          nicknameKey,
          prenom,
          nom,
          eventId: EVENT_ID,
          stepId: STEP_ID,
          playerId: playerRef.id,
          createdAt: serverTimestamp()
        });
      });

      setMessage("ok", `Inscription validée. Ton surnom : ${finalNickname}`);

      form.reset();
      suggestedNickname.textContent = "—";

    }catch(error){
      console.error(error);
      setMessage("error", error?.message || "Impossible d’enregistrer l’inscription.");
    }finally{
      isSubmitting = false;
      updateFormState();
    }
  });
</script>

</body>
</html>
