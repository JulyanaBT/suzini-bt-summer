<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Participants — Étape 1 Americano</title>

  <link rel="stylesheet" href="../assets/css/style.css" />

  <style>
    main{
      padding-top:calc(var(--etape-total-top, 150px) + 12px);
    }

    .participants-grid{
      display:grid;
      gap:14px;
    }

    .players-list{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }

    .player-chip{
      min-height:42px;
      border-radius:999px;
      padding:9px 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      font-size:15px;
      font-weight:1000;
      line-height:1.1;
      background:#fff;
      color:#063b72;
      box-shadow:0 6px 14px rgba(16,24,40,.10);
      word-break:break-word;
    }

    .player-chip.waiting{
      background:#fff7d6;
      color:#102033;
    }

    .empty{
      grid-column:1 / -1;
      padding:13px 14px;
      border-radius:16px;
      background:#fff;
      color:#667085;
      font-size:14px;
      font-weight:900;
      text-align:center;
    }

    @media(min-width:760px){
      .participants-grid{
        grid-template-columns:1fr 1fr;
      }

      .players-list{
        grid-template-columns:1fr 1fr 1fr;
      }
    }
  </style>
</head>

<body
  data-page="participants"
  data-type="americano"
  data-title="Étape 1 - Americano"
  data-date="02 juillet 2026"
>

<div id="siteHeaderEtape"></div>

<main class="container">

  <section class="section">
    <div class="summer-panel">
      <div class="summer-panel-head">
        <div>
          <h1 class="summer-panel-title">Participants</h1>
          <p class="summer-panel-text">
            Liste publique des surnoms. La programmation utilisera uniquement les joueurs actifs.
          </p>
        </div>
        <div class="summer-pill">
          <span id="countTotal">0</span> joueur(s)
        </div>
      </div>

      <div class="participants-grid">

        <div>
          <div class="summer-panel-head">
            <div>
              <h2 class="summer-panel-title" style="font-size:22px;">✅ Actifs</h2>
              <p class="summer-panel-text">Joueurs pris en compte immédiatement.</p>
            </div>
            <div class="summer-pill"><span id="countActive">0</span></div>
          </div>

          <div id="activeList" class="players-list">
            <div class="empty">Chargement…</div>
          </div>
        </div>

        <div>
          <div class="summer-panel-head">
            <div>
              <h2 class="summer-panel-title" style="font-size:22px;">⏳ En attente</h2>
              <p class="summer-panel-text">Non validés, absents, en pause ou partis.</p>
            </div>
            <div class="summer-pill"><span id="countWaiting">0</span></div>
          </div>

          <div id="waitingList" class="players-list">
            <div class="empty">Chargement…</div>
          </div>
        </div>

      </div>
    </div>
  </section>

</main>

<script type="module" src="../assets/js/header-etape.js"></script>

<script type="module">
  import { db } from "../assets/js/firebase.js?v=participants-etape1-v2";

  import {
    collection,
    onSnapshot,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const EVENT_ID = "suzini-summer-tour-2026";
  const STEP_ID = "etape-1";

  const activeList = document.getElementById("activeList");
  const waitingList = document.getElementById("waitingList");

  const countTotal = document.getElementById("countTotal");
  const countActive = document.getElementById("countActive");
  const countWaiting = document.getElementById("countWaiting");

  const playersRef = collection(db, "events", EVENT_ID, "steps", STEP_ID, "players");
  const q = query(playersRef, orderBy("createdAt", "asc"));

  function isActivePlayer(data){
    return data.publicList === "active" || data.status === "active";
  }

  function chip(nickname, type){
    const div = document.createElement("div");
    div.className = type === "waiting" ? "player-chip waiting" : "player-chip";
    div.textContent = nickname || "Sans surnom";
    return div;
  }

  function empty(text){
    const div = document.createElement("div");
    div.className = "empty";
    div.textContent = text;
    return div;
  }

  onSnapshot(q, (snap) => {
    activeList.innerHTML = "";
    waitingList.innerHTML = "";

    let active = 0;
    let waiting = 0;

    if(snap.empty){
      activeList.appendChild(empty("Aucun joueur actif."));
      waitingList.appendChild(empty("Aucun joueur en attente."));
      countTotal.textContent = "0";
      countActive.textContent = "0";
      countWaiting.textContent = "0";
      return;
    }

    snap.forEach(docSnap => {
      const data = docSnap.data() || {};
      const nickname = data.surnom || data.nickname || "Sans surnom";

      if(isActivePlayer(data)){
        active++;
        activeList.appendChild(chip(nickname, "active"));
      }else{
        waiting++;
        waitingList.appendChild(chip(nickname, "waiting"));
      }
    });

    if(active === 0){
      activeList.appendChild(empty("Aucun joueur actif."));
    }

    if(waiting === 0){
      waitingList.appendChild(empty("Aucun joueur en attente."));
    }

    countTotal.textContent = String(active + waiting);
    countActive.textContent = String(active);
    countWaiting.textContent = String(waiting);

  }, (error) => {
    console.error(error);

    activeList.innerHTML = "";
    waitingList.innerHTML = "";

    activeList.appendChild(empty("Impossible de charger les participants."));
    waitingList.appendChild(empty("Impossible de charger les participants."));
  });
</script>

</body>
</html>
