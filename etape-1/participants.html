<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Participants — Étape 1 Americano</title>

  <link rel="stylesheet" href="../assets/css/style.css" />

  <style>
    main{
      padding-top:12px;
    }

    .participants-grid{
      display:grid;
      gap:14px;
    }

    .list-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }

    .list-title{
      margin:0;
      font-size:21px;
      line-height:1.05;
      letter-spacing:-.03em;
      color:#063b72;
      font-weight:1000;
    }

    .list-sub{
      margin:4px 0 0;
      color:#667085;
      font-size:13px;
      font-weight:800;
      line-height:1.3;
    }

    .players-list{
      display:grid;
      grid-template-columns:1fr;
      gap:8px;
    }

    .player-chip{
      min-height:42px;
      border-radius:16px;
      padding:10px 12px;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      text-align:left;
      font-size:16px;
      font-weight:1000;
      line-height:1.1;
      background:#fff;
      color:#063b72;
      box-shadow:0 6px 14px rgba(16,24,40,.10);
      word-break:break-word;
    }

    .player-chip.waiting{
      background:#fff7d6;
      color:#102033;
    }

    .empty{
      padding:13px 14px;
      border-radius:16px;
      background:#fff;
      color:#667085;
      font-size:14px;
      font-weight:900;
      text-align:center;
    }

    @media(min-width:760px){
      main{
        padding-top:18px;
      }

      .participants-grid{
        grid-template-columns:1fr 1fr;
      }
    }
  </style>
</head>

<body
  data-page="participants"
  data-type="americano"
  data-title="Étape 1 - Americano"
  data-date="02 juillet 2026"
>

<div id="siteHeaderEtape"></div>

<main class="container">

  <section class="section">
    <div class="summer-panel">
      <div class="summer-panel-head">
        <div>
          <h1 class="summer-panel-title">Participants</h1>
          <p class="summer-panel-text">
            Surnoms publics des joueurs. Seuls les actifs sont pris en compte pour la programmation.
          </p>
        </div>
        <div class="summer-pill">
          <span id="countTotal">0</span> joueur(s)
        </div>
      </div>

      <div class="participants-grid">

        <div>
          <div class="list-head">
            <div>
              <h2 class="list-title">✅ Actifs</h2>
              <p class="list-sub">Pris en compte immédiatement.</p>
            </div>
            <div class="summer-pill"><span id="countActive">0</span></div>
          </div>

          <div id="activeList" class="players-list">
            <div class="empty">Chargement…</div>
          </div>
        </div>

        <div>
          <div class="list-head">
            <div>
              <h2 class="list-title">⏳ En attente</h2>
              <p class="list-sub">Non validés, absents, en pause ou partis.</p>
            </div>
            <div class="summer-pill"><span id="countWaiting">0</span></div>
          </div>

          <div id="waitingList" class="players-list">
            <div class="empty">Chargement…</div>
          </div>
        </div>

      </div>
    </div>
  </section>

</main>

<script type="module" src="../assets/js/header-etape.js"></script>

<script type="module">
  import { db } from "../assets/js/firebase.js?v=participants-etape1-v3";

  import {
    collection,
    onSnapshot,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const EVENT_ID = "suzini-summer-tour-2026";
  const STEP_ID = "etape-1";

  const activeList = document.getElementById("activeList");
  const waitingList = document.getElementById("waitingList");

  const countTotal = document.getElementById("countTotal");
  const countActive = document.getElementById("countActive");
  const countWaiting = document.getElementById("countWaiting");

  const playersRef = collection(db, "events", EVENT_ID, "steps", STEP_ID, "players");
  const q = query(playersRef, orderBy("createdAt", "asc"));

  function isActivePlayer(data){
    return data.publicList === "active" || data.status === "active";
  }

  function getNickname(data){
    return (data.surnom || data.nickname || "Sans surnom").trim();
  }

  function sortByNickname(a, b){
    return a.nickname.localeCompare(b.nickname, "fr", {
      sensitivity: "base",
      numeric: true
    });
  }

  function chip(nickname, type){
    const div = document.createElement("div");
    div.className = type === "waiting" ? "player-chip waiting" : "player-chip";
    div.textContent = nickname || "Sans surnom";
    return div;
  }

  function empty(text){
    const div = document.createElement("div");
    div.className = "empty";
    div.textContent = text;
    return div;
  }

  onSnapshot(q, (snap) => {
    activeList.innerHTML = "";
    waitingList.innerHTML = "";

    const activePlayers = [];
    const waitingPlayers = [];

    snap.forEach(docSnap => {
      const data = docSnap.data() || {};
      const nickname = getNickname(data);

      const row = {
        id: docSnap.id,
        nickname
      };

      if(isActivePlayer(data)){
        activePlayers.push(row);
      }else{
        waitingPlayers.push(row);
      }
    });

    activePlayers.sort(sortByNickname);
    waitingPlayers.sort(sortByNickname);

    if(activePlayers.length === 0){
      activeList.appendChild(empty("Aucun joueur actif."));
    }else{
      activePlayers.forEach(player => {
        activeList.appendChild(chip(player.nickname, "active"));
      });
    }

    if(waitingPlayers.length === 0){
      waitingList.appendChild(empty("Aucun joueur en attente."));
    }else{
      waitingPlayers.forEach(player => {
        waitingList.appendChild(chip(player.nickname, "waiting"));
      });
    }

    countActive.textContent = String(activePlayers.length);
    countWaiting.textContent = String(waitingPlayers.length);
    countTotal.textContent = String(activePlayers.length + waitingPlayers.length);

  }, (error) => {
    console.error(error);

    activeList.innerHTML = "";
    waitingList.innerHTML = "";

    activeList.appendChild(empty("Impossible de charger les participants."));
    waitingList.appendChild(empty("Impossible de charger les participants."));

    countActive.textContent = "0";
    countWaiting.textContent = "0";
    countTotal.textContent = "0";
  });
</script>

</body>
</html>
