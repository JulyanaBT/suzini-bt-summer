<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Participants — Étape 1 Americano</title>

  <link rel="stylesheet" href="../assets/css/style.css" />

  <style>
    .players-list{display:grid;gap:10px;}
    .player-card{
      background:#fff;
      color:#102033;
      border-radius:18px;
      padding:14px;
      box-shadow:0 8px 18px rgba(16,24,40,.12);
    }
    .player-name{
      font-size:22px;
      font-weight:1000;
      color:#063b72;
    }
    .player-meta{
      margin-top:4px;
      font-size:14px;
      font-weight:800;
      color:#344054;
    }
  </style>
</head>

<body
  data-page="participants"
  data-type="americano"
  data-title="Étape 1 - Americano"
  data-date="02 juillet 2026"
>

<div id="siteHeaderEtape"></div>

<main class="container">

  <section class="section">
    <div class="hero">
      <div class="hero-inner">
        <div class="hero-pills">
          <span class="pill">Participants</span>
          <span class="pill">Americano</span>
        </div>

        <div>
          <h1 class="hero-title">
            Joueurs<br>
            <span class="summer">inscrits</span>
          </h1>

          <div class="hero-slogan">
            Liste mise à jour automatiquement.
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="summer-panel">
      <div class="summer-panel-head">
        <div>
          <h2 class="summer-panel-title">Participants</h2>
          <p class="summer-panel-text">
            Les joueurs inscrits à l’Americano du 02 juillet.
          </p>
        </div>
        <div class="summer-pill"><span id="countPlayers">0</span> joueur(s)</div>
      </div>

      <div id="playersList" class="players-list">
        <div class="summer-note">Chargement des participants…</div>
      </div>
    </div>
  </section>

</main>

<script type="module" src="../assets/js/header-etape.js"></script>

<script type="module">
  import { db } from "../assets/js/firebase.js?v=participants-etape1";

  import {
    collection,
    onSnapshot,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const EVENT_ID = "suzini-summer-tour-2026";
  const STEP_ID = "etape-1";

  const playersList = document.getElementById("playersList");
  const countPlayers = document.getElementById("countPlayers");

  const playersRef = collection(db, "events", EVENT_ID, "steps", STEP_ID, "players");
  const q = query(playersRef, orderBy("createdAt", "asc"));

  onSnapshot(q, (snap) => {
    playersList.innerHTML = "";
    countPlayers.textContent = snap.size;

    if(snap.empty){
      playersList.innerHTML = `
        <div class="summer-note">
          Aucun joueur inscrit pour le moment.
        </div>
      `;
      return;
    }

    snap.forEach(docSnap => {
      const data = docSnap.data() || {};

      const div = document.createElement("div");
      div.className = "player-card";

      div.innerHTML = `
        <div class="player-name">${data.surnom || "Sans surnom"}</div>
        <div class="player-meta">
          ${data.prenom || ""} ${data.nom || ""}<br>
          Statut : ${data.status || "registered"}
        </div>
      `;

      playersList.appendChild(div);
    });

  }, (error) => {
    console.error(error);
    playersList.innerHTML = `
      <div class="summer-note">
        Impossible de charger les participants.
      </div>
    `;
  });
</script>

</body>
</html>
