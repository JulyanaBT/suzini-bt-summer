<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Programmation — Étape 1 Americano</title>

  <link rel="stylesheet" href="../assets/css/style.css" />

  <style>
    main{
      padding-top:8px;
      padding-bottom:24px;
    }

    .section{
      margin-top:8px;
    }

    .status-box{
      padding:10px 12px;
      border-radius:16px;
      background:#fff;
      color:#102033;
      font-size:13px;
      font-weight:1000;
      line-height:1.3;
      box-shadow:0 6px 14px rgba(16,24,40,.08);
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
      text-align:center;
    }

    .status-box strong{
      display:block;
      font-size:20px;
      color:#063b72;
      line-height:1;
    }

    .status-box span{
      display:block;
      margin-top:3px;
      color:#667085;
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.04em;
    }

    .section-title{
      margin:0 0 8px;
      font-size:19px;
      color:#063b72;
      font-weight:1000;
      letter-spacing:-.03em;
    }

    .rounds-list{
      display:grid;
      gap:8px;
    }

    .round-card{
      background:#fff;
      color:#102033;
      border-radius:18px;
      padding:10px;
      display:grid;
      gap:7px;
      box-shadow:0 8px 18px rgba(16,24,40,.10);
      border:1px solid rgba(16,24,40,.08);
    }

    .round-title{
      font-size:17px;
      font-weight:1000;
      color:#063b72;
      line-height:1;
    }

    .court-block,
    .bench-block{
      border-radius:15px;
      padding:8px;
      display:grid;
      gap:5px;
      border:1px solid rgba(16,24,40,.08);
    }

    .court-lisa{
      background:#ffeef2;
      border-color:rgba(255,0,60,.20);
    }

    .court-manon{
      background:#fff8dd;
      border-color:rgba(255,196,0,.35);
    }

    .bench-block{
      background:#e6f7ee;
      border-color:rgba(11,122,59,.22);
    }

    .court-head,
    .bench-head{
      display:grid;
      grid-template-columns:1fr auto;
      gap:8px;
      align-items:center;
    }

    .court-name,
    .bench-title{
      font-size:12px;
      font-weight:1000;
      color:#063b72;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .bench-title{
      color:#087a35;
    }

    .match-pill{
      padding:4px 8px;
      border-radius:999px;
      font-size:9px;
      font-weight:1000;
      text-transform:uppercase;
      background:#fff7d6;
      color:#102033;
      white-space:nowrap;
    }

    .match-pill.current{
      background:#d9fbe8;
      color:#087a35;
    }

    .match-pill.done{
      background:#e6f7ee;
      color:#087a35;
    }

    .team-row{
      display:grid;
      grid-template-columns:1fr 42px;
      gap:6px;
      align-items:center;
    }

    .team-name{
      min-height:30px;
      border-radius:12px;
      padding:7px 9px;
      background:rgba(255,255,255,.82);
      font-size:13px;
      font-weight:1000;
      color:#102033;
      line-height:1.05;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .score-box{
      min-height:30px;
      border-radius:12px;
      padding:6px 8px;
      background:#fff;
      color:#063b72;
      font-size:15px;
      font-weight:1000;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:inset 0 0 0 1px rgba(16,24,40,.10);
    }

    .bench-list{
      min-height:30px;
      border-radius:12px;
      padding:7px 9px;
      background:rgba(255,255,255,.82);
      font-size:13px;
      font-weight:1000;
      color:#102033;
      line-height:1.15;
    }

    .empty{
      padding:12px 14px;
      border-radius:16px;
      background:#fff;
      color:#667085;
      font-size:14px;
      font-weight:900;
      text-align:center;
    }

    .compact-panel{
      padding:12px;
    }

    @media(min-width:760px){
      main{
        padding-top:14px;
      }

      .rounds-list{
        grid-template-columns:1fr 1fr;
      }
    }
  </style>
</head>

<body
  data-page="programmation"
  data-type="americano"
  data-title="Étape 1 - Americano"
  data-date="02 juillet 2026"
>

<div id="siteHeaderEtape"></div>

<main class="container">

  <section class="section">
    <div class="summer-panel compact-panel">
      <div id="statusBox" class="status-box">
        <div>
          <strong id="countRounds">0</strong>
          <span>Tours</span>
        </div>
        <div>
          <strong id="countPending">0</strong>
          <span>À jouer</span>
        </div>
        <div>
          <strong id="countDone">0</strong>
          <span>Terminés</span>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="summer-panel compact-panel">
      <h2 class="section-title">🔥 Tours en cours / à venir</h2>
      <div id="currentList" class="rounds-list">
        <div class="empty">Chargement…</div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="summer-panel compact-panel">
      <h2 class="section-title">✅ Tours terminés</h2>
      <div id="doneList" class="rounds-list">
        <div class="empty">Chargement…</div>
      </div>
    </div>
  </section>

</main>

<script type="module" src="../assets/js/header-etape.js"></script>
<script type="module" src="../assets/js/maintenance-guard-etape.js"></script>

<script type="module">
  import { db } from "../assets/js/firebase.js?v=public-prog-americano-3";

  import {
    collection,
    onSnapshot,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const EVENT_ID = "suzini-summer-tour-2026";
  const STEP_ID = "etape-1";

  const currentList = document.getElementById("currentList");
  const doneList = document.getElementById("doneList");

  const countRounds = document.getElementById("countRounds");
  const countPending = document.getElementById("countPending");
  const countDone = document.getElementById("countDone");

  const playersRef = collection(db, "events", EVENT_ID, "steps", STEP_ID, "players");
  const roundsRef = collection(db, "events", EVENT_ID, "steps", STEP_ID, "rounds");

  let players = [];
  let rounds = [];

  function esc(value){
    return String(value || "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function playerName(id){
    const p = players.find(x => x.id === id);
    return p?.nickname || "Joueur";
  }

  function teamName(team){
    if(!Array.isArray(team) || team.length < 2) return "Équipe";
    return `${playerName(team[0])} / ${playerName(team[1])}`;
  }

  function benchNames(bench){
    if(!Array.isArray(bench) || bench.length === 0) return "Aucun joueur sur le banc";
    return bench.map(playerName).join(" • ");
  }

  function scoreValue(value){
    if(value === null || value === undefined || value === "") return "—";
    return String(value);
  }

  function isCompleted(match){
    return match?.status === "completed";
  }

  function roundCompleted(round){
    const matches = round.matches || [];
    return matches.length > 0 && matches.every(isCompleted);
  }

  function roundPending(round){
    return (round.matches || []).some(match => !isCompleted(match));
  }

  function matchState(match){
    if(isCompleted(match)) return "Terminé";
    return "À venir";
  }

  function matchPillClass(match){
    if(isCompleted(match)) return "done";
    return "current";
  }

  function courtClass(court){
    if(String(court || "").includes("Lisa")) return "court-lisa";
    if(String(court || "").includes("Manon")) return "court-manon";
    return "";
  }

  function courtOrder(match){
    const court = String(match?.court || "");
    if(court.includes("Lisa")) return 1;
    if(court.includes("Manon")) return 2;
    return 9;
  }

  function sortedMatches(round){
    return [...(round.matches || [])].sort((a,b) => {
      const courtDiff = courtOrder(a) - courtOrder(b);
      if(courtDiff !== 0) return courtDiff;
      return Number(a.matchIndex || 0) - Number(b.matchIndex || 0);
    });
  }

  function renderCourt(match){
    const cls = courtClass(match.court);

    return `
      <div class="court-block ${esc(cls)}">
        <div class="court-head">
          <div class="court-name">${esc(match.court || "Terrain")}</div>
          <div class="match-pill ${matchPillClass(match)}">${esc(matchState(match))}</div>
        </div>

        <div class="team-row">
          <div class="team-name">${esc(teamName(match.teamA))}</div>
          <div class="score-box">${esc(scoreValue(match.scoreA))}</div>
        </div>

        <div class="team-row">
          <div class="team-name">${esc(teamName(match.teamB))}</div>
          <div class="score-box">${esc(scoreValue(match.scoreB))}</div>
        </div>
      </div>
    `;
  }

  function renderBench(round){
    return `
      <div class="bench-block">
        <div class="bench-head">
          <div class="bench-title">🌴 Banc</div>
          <div class="match-pill current">Actifs</div>
        </div>

        <div class="bench-list">
          ${esc(benchNames(round.bench))}
        </div>
      </div>
    `;
  }

  function renderRound(round){
    const matches = sortedMatches(round);

    return `
      <div class="round-card">
        <div class="round-title">Tour ${esc(round.roundNumber)}</div>
        ${matches.map(renderCourt).join("")}
        ${renderBench(round)}
      </div>
    `;
  }

  function render(){
    const pendingRounds = rounds
      .filter(roundPending)
      .sort((a,b) => Number(a.roundNumber) - Number(b.roundNumber));

    const doneRounds = rounds
      .filter(roundCompleted)
      .sort((a,b) => Number(b.roundNumber) - Number(a.roundNumber));

    const allMatches = rounds.flatMap(round => round.matches || []);
    const pendingMatches = allMatches.filter(match => !isCompleted(match));
    const doneMatches = allMatches.filter(isCompleted);

    countRounds.textContent = String(rounds.length);
    countPending.textContent = String(pendingMatches.length);
    countDone.textContent = String(doneMatches.length);

    currentList.innerHTML = pendingRounds.length
      ? pendingRounds.map(renderRound).join("")
      : `<div class="empty">Aucun tour en cours.</div>`;

    doneList.innerHTML = doneRounds.length
      ? doneRounds.map(renderRound).join("")
      : `<div class="empty">Aucun tour terminé.</div>`;
  }

  onSnapshot(query(playersRef, orderBy("createdAt", "asc")), (snap) => {
    players = snap.docs.map(d => {
      const data = d.data() || {};
      return {
        id:d.id,
        nickname:data.surnom || data.nickname || "Sans surnom"
      };
    });

    render();

  }, (error) => {
    console.error(error);
    currentList.innerHTML = `<div class="empty">Impossible de charger les participants.</div>`;
  });

  onSnapshot(query(roundsRef, orderBy("roundNumber", "asc")), (snap) => {
    rounds = snap.docs.map(d => ({
      id:d.id,
      ...d.data()
    }));

    render();

  }, (error) => {
    console.error(error);
    currentList.innerHTML = `<div class="empty">Impossible de charger la programmation.</div>`;
  });
</script>

</body>
</html>
