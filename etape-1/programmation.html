<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Programmation — Étape 1 Americano</title>

  <link rel="stylesheet" href="../assets/css/style.css" />

  <style>
    main{padding-top:12px;}

    .status-box{
      padding:12px 14px;
      border-radius:16px;
      background:#fff;
      color:#102033;
      font-size:14px;
      font-weight:900;
      line-height:1.35;
      box-shadow:0 6px 14px rgba(16,24,40,.08);
    }

    .program-grid{
      display:grid;
      gap:12px;
    }

    .match-card{
      background:#fff;
      color:#102033;
      border-radius:18px;
      padding:13px;
      display:grid;
      gap:10px;
      box-shadow:0 8px 18px rgba(16,24,40,.10);
      border:1px solid rgba(16,24,40,.08);
    }

    .match-card.done{
      opacity:.88;
      background:#f8fafc;
    }

    .match-card.court-a{
      background:#fff8dd;
      border-color:rgba(255,196,0,.35);
    }

    .match-card.court-b{
      background:#ffeef2;
      border-color:rgba(255,0,60,.20);
    }

    .match-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
    }

    .match-title{
      font-size:18px;
      font-weight:1000;
      color:#063b72;
      line-height:1.1;
    }

    .match-sub{
      margin-top:4px;
      font-size:13px;
      font-weight:900;
      color:#667085;
    }

    .match-pill{
      flex-shrink:0;
      padding:6px 10px;
      border-radius:999px;
      font-size:11px;
      font-weight:1000;
      text-transform:uppercase;
      background:#fff7d6;
      color:#102033;
    }

    .match-pill.done{
      background:#d9fbe8;
      color:#087a35;
    }

    .teams{
      display:grid;
      gap:8px;
    }

    .team-row{
      display:grid;
      grid-template-columns:1fr 54px;
      gap:8px;
      align-items:center;
    }

    .team-name{
      min-height:44px;
      border-radius:15px;
      padding:10px 12px;
      background:rgba(255,255,255,.80);
      font-weight:1000;
      color:#102033;
      display:flex;
      align-items:center;
      line-height:1.15;
    }

    .score-box{
      min-height:44px;
      border-radius:15px;
      padding:8px 10px;
      background:#fff;
      color:#063b72;
      font-size:20px;
      font-weight:1000;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:inset 0 0 0 1px rgba(16,24,40,.10);
    }

    .vs-line{
      text-align:center;
      font-weight:1000;
      letter-spacing:2px;
      color:#667085;
      font-size:12px;
    }

    .bench-box{
      margin-top:10px;
      padding:10px 12px;
      border-radius:16px;
      background:#fff7d6;
      color:#102033;
      font-size:13px;
      font-weight:900;
      line-height:1.35;
    }

    .section-title{
      margin:0 0 10px;
      font-size:22px;
      color:#063b72;
      font-weight:1000;
      letter-spacing:-.03em;
    }

    .empty{
      padding:13px 14px;
      border-radius:16px;
      background:#fff;
      color:#667085;
      font-size:14px;
      font-weight:900;
      text-align:center;
    }

    @media(min-width:760px){
      main{padding-top:18px;}
      .program-grid{grid-template-columns:1fr 1fr;}
    }
  </style>
</head>

<body
  data-page="programmation"
  data-type="americano"
  data-title="Étape 1 - Americano"
  data-date="02 juillet 2026"
>

<div id="siteHeaderEtape"></div>

<main class="container">

  <section class="section">
    <div class="summer-panel">
      <div class="summer-panel-head">
        <div>
          <h1 class="summer-panel-title">Programmation</h1>
          <p class="summer-panel-text">
            Matchs en cours, matchs à venir et résultats de l’Americano.
          </p>
        </div>
        <div class="summer-pill">Live</div>
      </div>

      <div id="statusBox" class="status-box">
        Chargement de la programmation…
      </div>
    </div>
  </section>

  <section class="section">
    <div class="summer-panel">
      <h2 class="section-title">🔥 Matchs en cours / à venir</h2>
      <div id="currentList" class="program-grid">
        <div class="empty">Chargement…</div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="summer-panel">
      <h2 class="section-title">✅ Matchs terminés</h2>
      <div id="doneList" class="program-grid">
        <div class="empty">Chargement…</div>
      </div>
    </div>
  </section>

</main>

<script type="module" src="../assets/js/header-etape.js"></script>

<script type="module">
  import { db } from "../assets/js/firebase.js?v=public-prog-americano-1";

  import {
    collection,
    onSnapshot,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const EVENT_ID = "suzini-summer-tour-2026";
  const STEP_ID = "etape-1";

  const statusBox = document.getElementById("statusBox");
  const currentList = document.getElementById("currentList");
  const doneList = document.getElementById("doneList");

  const playersRef = collection(db, "events", EVENT_ID, "steps", STEP_ID, "players");
  const roundsRef = collection(db, "events", EVENT_ID, "steps", STEP_ID, "rounds");

  let players = [];
  let rounds = [];

  function esc(value){
    return String(value || "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function playerName(id){
    const p = players.find(x => x.id === id);
    return p?.nickname || "Joueur";
  }

  function teamName(team){
    if(!Array.isArray(team) || team.length < 2) return "Équipe";
    return `${playerName(team[0])} / ${playerName(team[1])}`;
  }

  function allMatches(){
    return rounds.flatMap(round =>
      (round.matches || []).map(match => ({
        ...match,
        roundId: round.id,
        roundNumber: round.roundNumber,
        bench: round.bench || []
      }))
    );
  }

  function completedMatches(){
    return allMatches().filter(m => m.status === "completed");
  }

  function pendingMatches(){
    return allMatches().filter(m => m.status !== "completed");
  }

  function courtClass(court){
    if(String(court || "").includes("Lisa")) return "court-a";
    if(String(court || "").includes("Manon")) return "court-b";
    return "";
  }

  function scoreValue(value){
    if(value === null || value === undefined || value === "") return "—";
    return String(value);
  }

  function renderMatch(match){
    const done = match.status === "completed";
    const cls = courtClass(match.court);

    return `
      <div class="match-card ${done ? "done" : ""} ${esc(cls)}">
        <div class="match-head">
          <div>
            <div class="match-title">Tour ${esc(match.roundNumber)} — ${esc(match.court)}</div>
            <div class="match-sub">${done ? "Résultat validé" : "Match à jouer"}</div>
          </div>

          <div class="match-pill ${done ? "done" : ""}">
            ${done ? "Terminé" : "À jouer"}
          </div>
        </div>

        <div class="teams">
          <div class="team-row">
            <div class="team-name">${esc(teamName(match.teamA))}</div>
            <div class="score-box">${esc(scoreValue(match.scoreA))}</div>
          </div>

          <div class="vs-line">VS</div>

          <div class="team-row">
            <div class="team-name">${esc(teamName(match.teamB))}</div>
            <div class="score-box">${esc(scoreValue(match.scoreB))}</div>
          </div>
        </div>
      </div>
    `;
  }

  function renderBench(round){
    const bench = Array.isArray(round.bench) ? round.bench : [];
    if(!bench.length) return "";

    return `
      <div class="bench-box">
        Banc tour ${esc(round.roundNumber)} :
        ${bench.map(playerName).map(esc).join(" • ")}
      </div>
    `;
  }

  function render(){
    const pending = pendingMatches()
      .sort((a,b) => Number(a.roundNumber) - Number(b.roundNumber) || Number(a.matchIndex) - Number(b.matchIndex));

    const done = completedMatches()
      .sort((a,b) => {
        const da = a.completedAt?.seconds || 0;
        const db = b.completedAt?.seconds || 0;
        if(db !== da) return db - da;
        return Number(b.roundNumber) - Number(a.roundNumber);
      });

    currentList.innerHTML = pending.length
      ? pending.map(renderMatch).join("")
      : `<div class="empty">Aucun match en cours.</div>`;

    doneList.innerHTML = done.length
      ? done.map(renderMatch).join("")
      : `<div class="empty">Aucun match terminé.</div>`;

    const activeRounds = rounds.filter(round =>
      (round.matches || []).some(match => match.status !== "completed")
    );

    const benchHtml = activeRounds
      .map(renderBench)
      .filter(Boolean)
      .join("");

    statusBox.innerHTML = `
      ${rounds.length} tour(s) généré(s) —
      ${pending.length} match(s) à jouer —
      ${done.length} match(s) terminé(s).
      ${benchHtml ? `<div style="margin-top:10px;">${benchHtml}</div>` : ""}
    `;
  }

  onSnapshot(query(playersRef, orderBy("createdAt", "asc")), (snap) => {
    players = snap.docs.map(d => {
      const data = d.data() || {};
      return {
        id:d.id,
        nickname:data.surnom || data.nickname || "Sans surnom"
      };
    });

    render();

  }, (error) => {
    console.error(error);
    statusBox.textContent = "Impossible de charger les participants.";
  });

  onSnapshot(query(roundsRef, orderBy("roundNumber", "asc")), (snap) => {
    rounds = snap.docs.map(d => ({
      id:d.id,
      ...d.data()
    }));

    render();

  }, (error) => {
    console.error(error);
    statusBox.textContent = "Impossible de charger la programmation.";
  });
</script>

</body>
</html>
