<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Classement — Étape 1 Americano</title>

  <link rel="stylesheet" href="../assets/css/style.css" />

  <style>
    main{
      padding-top:8px;
      padding-bottom:24px;
    }

    .section{margin-top:8px;}

    .compact-panel{padding:12px;}

    .ranking-list{
      display:grid;
      gap:8px;
    }

    .rank-card{
      background:#fff;
      color:#102033;
      border-radius:16px;
      padding:10px;
      display:grid;
      gap:8px;
      box-shadow:0 6px 14px rgba(16,24,40,.10);
      border:1px solid rgba(16,24,40,.08);
    }

    .rank-card.top1{
      background:linear-gradient(135deg,#fff8dd,#ffffff);
      border-color:rgba(255,196,0,.45);
    }

    .rank-main{
      display:grid;
      grid-template-columns:38px 1fr auto;
      gap:8px;
      align-items:center;
    }

    .rank-pos{
      width:38px;
      height:38px;
      border-radius:14px;
      background:#063b72;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:17px;
      font-weight:1000;
    }

    .rank-card.top1 .rank-pos{
      background:linear-gradient(180deg,#ffd84d,#d99b00);
      color:#102033;
    }

    .rank-name{
      font-size:18px;
      font-weight:1000;
      color:#063b72;
      line-height:1.05;
    }

    .rank-sub{
      margin-top:3px;
      color:#667085;
      font-size:11px;
      font-weight:900;
      line-height:1.25;
    }

    .rank-points{
      text-align:right;
      color:#063b72;
      font-weight:1000;
      line-height:1;
    }

    .rank-points strong{
      display:block;
      font-size:24px;
    }

    .rank-points span{
      display:block;
      margin-top:2px;
      font-size:9px;
      text-transform:uppercase;
      color:#667085;
      letter-spacing:.04em;
    }

    .rank-stats{
      display:grid;
      grid-template-columns:repeat(6,1fr);
      gap:5px;
    }

    .mini-stat{
      border-radius:12px;
      background:#f8fafc;
      padding:6px 4px;
      text-align:center;
      font-weight:1000;
      color:#102033;
    }

    .mini-stat strong{
      display:block;
      font-size:15px;
      line-height:1;
      color:#063b72;
    }

    .mini-stat span{
      display:block;
      margin-top:3px;
      font-size:8px;
      color:#667085;
      text-transform:uppercase;
      letter-spacing:.03em;
    }

    .mini-stat.bonus{
      background:#fff7d6;
    }

    .empty{
      padding:12px 14px;
      border-radius:16px;
      background:#fff;
      color:#667085;
      font-size:14px;
      font-weight:900;
      text-align:center;
    }

    .info-box{
      padding:10px 12px;
      border-radius:16px;
      background:#fff;
      color:#102033;
      font-size:13px;
      font-weight:900;
      line-height:1.35;
      box-shadow:0 6px 14px rgba(16,24,40,.08);
    }

    @media(min-width:760px){
      main{padding-top:14px;}
      .ranking-list{grid-template-columns:1fr 1fr;}
    }
  </style>
</head>

<body
  data-page="classement"
  data-type="americano"
  data-title="Étape 1 - Americano"
  data-date="02 juillet 2026"
>

<div id="siteHeaderEtape"></div>

<main class="container">

  <section class="section">
    <div class="summer-panel compact-panel">
      <div class="info-box">
        Victoire : 2 pts match • Défaite : 1 pt match • Bonus : +2 pts jeu par tour actif • Classement sur les 5 meilleurs résultats.
      </div>
    </div>
  </section>

  <section class="section">
    <div class="summer-panel compact-panel">
      <div id="rankingList" class="ranking-list">
        <div class="empty">Chargement du classement…</div>
      </div>
    </div>
  </section>

</main>

<script type="module" src="../assets/js/header-etape.js"></script>
<script type="module" src="../assets/js/maintenance-guard-etape.js"></script>

<script type="module">
  import { db } from "../assets/js/firebase.js?v=public-ranking-americano-2";

  import {
    collection,
    onSnapshot,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const EVENT_ID = "suzini-summer-tour-2026";
  const STEP_ID = "etape-1";

  const rankingList = document.getElementById("rankingList");

  const playersRef = collection(db, "events", EVENT_ID, "steps", STEP_ID, "players");
  const roundsRef = collection(db, "events", EVENT_ID, "steps", STEP_ID, "rounds");

  let players = [];
  let rounds = [];

  function esc(value){
    return String(value || "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function sortPlayers(a,b){
    return a.nickname.localeCompare(b.nickname, "fr", {
      sensitivity:"base",
      numeric:true
    });
  }

  function completedMatches(){
    return rounds.flatMap(round =>
      (round.matches || [])
        .filter(match => match.status === "completed")
        .map(match => ({
          ...match,
          roundId:round.id,
          roundNumber:round.roundNumber
        }))
    );
  }

  function makeBaseStats(){
    const map = new Map();

    players.forEach(player => {
      map.set(player.id, {
        id:player.id,
        nickname:player.nickname,
        matches:0,
        wins:0,
        losses:0,
        matchPointsTotal:0,
        scoredTotal:0,
        concededTotal:0,
        gameDiffTotal:0,
        activeTurns:0,
        bonusGamePoints:0,
        rankingMatchPoints:0,
        rankingScored:0,
        rankingConceded:0,
        rankingDiff:0,
        results:[]
      });
    });

    return map;
  }

  function addRoundBonus(stats){
    rounds.forEach(round => {
      const activeInRound = new Set();

      (round.matches || []).forEach(match => {
        [...(match.teamA || []), ...(match.teamB || [])].forEach(id => activeInRound.add(id));
      });

      (round.bench || []).forEach(id => activeInRound.add(id));

      activeInRound.forEach(id => {
        const row = stats.get(id);
        if(row){
          row.activeTurns += 1;
          row.bonusGamePoints += 2;
        }
      });
    });
  }

  function computeRanking(){
    const stats = makeBaseStats();
    addRoundBonus(stats);

    completedMatches().forEach(match => {
      const scoreA = Number(match.scoreA);
      const scoreB = Number(match.scoreB);

      if(!Number.isFinite(scoreA) || !Number.isFinite(scoreB) || scoreA === scoreB) return;

      const teamA = match.teamA || [];
      const teamB = match.teamB || [];

      const aWon = scoreA > scoreB;

      teamA.forEach(id => {
        const row = stats.get(id);
        if(!row) return;

        const matchPoints = aWon ? 2 : 1;

        row.matches++;
        row.wins += aWon ? 1 : 0;
        row.losses += aWon ? 0 : 1;
        row.matchPointsTotal += matchPoints;
        row.scoredTotal += scoreA;
        row.concededTotal += scoreB;
        row.gameDiffTotal += scoreA - scoreB;

        row.results.push({
          matchPoints,
          scored:scoreA,
          conceded:scoreB,
          diff:scoreA - scoreB
        });
      });

      teamB.forEach(id => {
        const row = stats.get(id);
        if(!row) return;

        const matchPoints = aWon ? 1 : 2;

        row.matches++;
        row.wins += aWon ? 0 : 1;
        row.losses += aWon ? 1 : 0;
        row.matchPointsTotal += matchPoints;
        row.scoredTotal += scoreB;
        row.concededTotal += scoreA;
        row.gameDiffTotal += scoreB - scoreA;

        row.results.push({
          matchPoints,
          scored:scoreB,
          conceded:scoreA,
          diff:scoreB - scoreA
        });
      });
    });

    const rows = Array.from(stats.values());

    rows.forEach(row => {
      const bestFive = row.results
        .sort((a,b) => {
          if(b.matchPoints !== a.matchPoints) return b.matchPoints - a.matchPoints;
          if(b.diff !== a.diff) return b.diff - a.diff;
          return b.scored - a.scored;
        })
        .slice(0,5);

      row.rankingMatchPoints = bestFive.reduce((sum,r) => sum + r.matchPoints, 0);

      row.rankingScored =
        bestFive.reduce((sum,r) => sum + r.scored, 0)
        + row.bonusGamePoints;

      row.rankingConceded = bestFive.reduce((sum,r) => sum + r.conceded, 0);
      row.rankingDiff = row.rankingScored - row.rankingConceded;
    });

    return rows.sort((a,b) => {
      if(b.rankingMatchPoints !== a.rankingMatchPoints){
        return b.rankingMatchPoints - a.rankingMatchPoints;
      }

      if(b.rankingDiff !== a.rankingDiff){
        return b.rankingDiff - a.rankingDiff;
      }

      if(b.rankingScored !== a.rankingScored){
        return b.rankingScored - a.rankingScored;
      }

      return a.nickname.localeCompare(b.nickname, "fr", {
        sensitivity:"base",
        numeric:true
      });
    });
  }

  function renderRankCard(row, index){
    return `
      <div class="rank-card ${index === 0 ? "top1" : ""}">
        <div class="rank-main">
          <div class="rank-pos">${index + 1}</div>

          <div>
            <div class="rank-name">${esc(row.nickname)}</div>
            <div class="rank-sub">
              ${row.matches} match(s) • ${row.activeTurns} tour(s) actif(s) • bonus +${row.bonusGamePoints}
            </div>
          </div>

          <div class="rank-points">
            <strong>${row.rankingMatchPoints}</strong>
            <span>pts match</span>
          </div>
        </div>

        <div class="rank-stats">
          <div class="mini-stat">
            <strong>${row.wins}</strong>
            <span>V</span>
          </div>

          <div class="mini-stat">
            <strong>${row.losses}</strong>
            <span>D</span>
          </div>

          <div class="mini-stat bonus">
            <strong>${row.bonusGamePoints}</strong>
            <span>Bonus</span>
          </div>

          <div class="mini-stat">
            <strong>${row.rankingScored}</strong>
            <span>+</span>
          </div>

          <div class="mini-stat">
            <strong>${row.rankingConceded}</strong>
            <span>-</span>
          </div>

          <div class="mini-stat">
            <strong>${row.rankingDiff}</strong>
            <span>Diff</span>
          </div>
        </div>
      </div>
    `;
  }

  function render(){
    if(players.length === 0){
      rankingList.innerHTML = `<div class="empty">Aucun joueur inscrit.</div>`;
      return;
    }

    const ranking = computeRanking();

    if(ranking.every(row => row.matches === 0)){
      const sorted = [...ranking].sort(sortPlayers);

      rankingList.innerHTML = sorted.map((row, index) => `
        <div class="rank-card">
          <div class="rank-main">
            <div class="rank-pos">${index + 1}</div>
            <div>
              <div class="rank-name">${esc(row.nickname)}</div>
              <div class="rank-sub">
                ${row.activeTurns} tour(s) actif(s) • bonus +${row.bonusGamePoints}
              </div>
            </div>
            <div class="rank-points">
              <strong>0</strong>
              <span>pts match</span>
            </div>
          </div>

          <div class="rank-stats">
            <div class="mini-stat bonus">
              <strong>${row.bonusGamePoints}</strong>
              <span>Bonus</span>
            </div>
            <div class="mini-stat">
              <strong>${row.rankingScored}</strong>
              <span>+</span>
            </div>
            <div class="mini-stat">
              <strong>${row.rankingConceded}</strong>
              <span>-</span>
            </div>
            <div class="mini-stat">
              <strong>${row.rankingDiff}</strong>
              <span>Diff</span>
            </div>
          </div>
        </div>
      `).join("");

      return;
    }

    rankingList.innerHTML = ranking.map(renderRankCard).join("");
  }

  onSnapshot(query(playersRef, orderBy("createdAt", "asc")), (snap) => {
    players = snap.docs.map(d => {
      const data = d.data() || {};

      return {
        id:d.id,
        nickname:data.surnom || data.nickname || "Sans surnom"
      };
    });

    render();

  }, (error) => {
    console.error(error);
    rankingList.innerHTML = `<div class="empty">Impossible de charger les joueurs.</div>`;
  });

  onSnapshot(query(roundsRef, orderBy("roundNumber", "asc")), (snap) => {
    rounds = snap.docs.map(d => ({
      id:d.id,
      ...d.data()
    }));

    render();

  }, (error) => {
    console.error(error);
    rankingList.innerHTML = `<div class="empty">Impossible de charger le classement.</div>`;
  });
</script>

</body>
</html>
